<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>坦克车体 · 单文件 WebGL 面朝向自检</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0e14; }
  #gl { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #hud {
    position: fixed; left: 12px; top: 12px; padding: 10px 12px;
    font: 12px/1.75 ui-monospace, Menlo, Consolas, monospace;
    color: #dfe7ef; background: rgba(10, 14, 20, 0.74);
    border: 1px solid rgba(150, 190, 230, 0.25); border-radius: 8px;
    user-select: none; max-width: min(560px, 92vw);
  }
  #hud b { color: #9fe0a0; }
  #hud label { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; }
  #hud input[type=range] { width: 110px; vertical-align: middle; }
  .hint { color: #9db4c9; }
  #err { color: #ff8a8a; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div><b>操作</b>：<span class="hint">W/S 前进后退 · A/D 转向 · 单击画面后移动鼠标转炮塔 · Esc 释放鼠标捕获</span></div>
  <div style="margin-top:6px">
    <label>灵敏度 <input id="sens" type="range" min="0.1" max="3" step="0.05" value="1" /><span id="sensVal">1.00</span></label>
    <label><input id="invy" type="checkbox" /> 反转 Y 轴</label>
  </div>
  <div id="err" style="margin-top:6px"></div>
</div>
<script>
(function () {
  'use strict';

  /* =========================================================================
   * controls 六个键的确切含义与来源（__selftest().controls 原样回读下列运行时状态）
   *   move        : boolean  W/S（含 ArrowUp / ArrowDown）键通道是否已绑定可用
   *                          来源：KEY_MAP 中 KeyW、KeyS 均存在，且 window 上的 keydown/keyup 已注册
   *   turn        : boolean  A/D（含 ArrowLeft / ArrowRight）键通道是否已绑定可用
   *                          来源：KEY_MAP 中 KeyA、KeyD 均存在，且 window 上的 keydown/keyup 已注册
   *   turret      : boolean  鼠标转炮塔通道是否已绑定可用
   *                          来源：#gl 的 click（请求指针锁定）+ document 的 mousemove 已注册
   *   exitCapture : boolean  是否存在退出指针锁定 / 释放控制的路径
   *                          来源：document.exitPointerLock 可用 且 pointerlockchange 处理器已注册
   *   sensitivity : number   当前鼠标灵敏度（恒 > 0）
   *                          来源：#sens 滑块的当前值，input 事件实时同步
   *   invertY     : boolean  当前是否反转 Y 轴
   *                          来源：#invy 复选框当前 checked，change 事件实时同步
   * ========================================================================= */

  /* =========================================================================
   * 1. 几何构造（纯函数：无参、不读 DOM、不写全局、不用时间/随机）
   *    右手坐标系，Y 轴向上；三角形顶点绕序 CCW 时该面朝外。
   *    每个面按“从外侧看逆时针”的顺序给四点，法线由 u×v 得到，天然朝外。
   * ========================================================================= */
  function buildGeometry() {
    var positions = [];   // 扁平数字数组，每 3 个数一个顶点 (x,y,z)
    var indices = [];     // 三角形索引，长度是 3 的倍数
    var normals = [];     // 每顶点法线（仅供渲染光照使用，与面朝向判定无关）
    var parts = [];       // 0 = 车体，1 = 炮塔（按 part 做局部旋转）

    function addQuad(q0, q1, q2, q3, part) {
      var base = positions.length / 3;
      var ax = q1[0] - q0[0], ay = q1[1] - q0[1], az = q1[2] - q0[2]; // u
      var bx = q3[0] - q0[0], by = q3[1] - q0[1], bz = q3[2] - q0[2]; // v
      var nx = ay * bz - az * by;
      var ny = az * bx - ax * bz;
      var nz = ax * by - ay * bx;
      var len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      if (len > 0) { nx /= len; ny /= len; nz /= len; }
      var qs = [q0, q1, q2, q3];
      for (var i = 0; i < 4; i++) {
        positions.push(qs[i][0], qs[i][1], qs[i][2]);
        normals.push(nx, ny, nz);
        parts.push(part);
      }
      indices.push(base, base + 1, base + 2, base, base + 2, base + 3);
    }

    function addBox(x0, y0, z0, x1, y1, z1, part) {
      addQuad([x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], part); // +X
      addQuad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], part); // -X
      addQuad([x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0], part); // +Y
      addQuad([x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], part); // -Y
      addQuad([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], part); // +Z
      addQuad([x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], part); // -Z
    }

    // 坦克车体盒子
    addBox(-1.20, 0.30, -1.80, 1.20, 1.20, 1.80, 0);
    // 炮塔盒子：下半部埋进车体内，使整体 AABB 中心点严格位于其内部，
    // 从而炮塔的每一个三角形相对该中心点都满足 n·r > 0（朝外）。
    addBox(-0.75, 0.90, -0.85, 0.75, 1.75, 0.85, 1);

    return { positions: positions, indices: indices, normals: normals, parts: parts };
  }

  /* =========================================================================
   * 2. 面朝向判定（纯函数，与渲染共用同一份 positions/indices）
   *    n = (v1-v0)×(v2-v0)；r = 三角形重心 − 顶点包围盒(AABB)中心
   *    n·r > 0 → 朝外；n·r < 0 → 朝内；|n·r| <= |n|*|r|*1e-6 → 退化（不计入朝外）
   * ========================================================================= */
  function analyzeFaces(positions, indices) {
    var vCount = Math.floor(positions.length / 3);
    var minX = Infinity, minY = Infinity, minZ = Infinity;
    var maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
    var i, x, y, z;
    for (i = 0; i < vCount; i++) {
      x = positions[i * 3]; y = positions[i * 3 + 1]; z = positions[i * 3 + 2];
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
      if (z < minZ) minZ = z;
      if (z > maxZ) maxZ = z;
    }
    var cx = (minX + maxX) / 2;
    var cy = (minY + maxY) / 2;
    var cz = (minZ + maxZ) / 2;

    var faces = Math.floor(indices.length / 3);
    var outward = 0, inward = 0, degenerate = 0;

    for (i = 0; i < faces; i++) {
      var i0 = indices[i * 3], i1 = indices[i * 3 + 1], i2 = indices[i * 3 + 2];
      var ax = positions[i0 * 3], ay = positions[i0 * 3 + 1], az = positions[i0 * 3 + 2];
      var bx = positions[i1 * 3], by = positions[i1 * 3 + 1], bz = positions[i1 * 3 + 2];
      var dx = positions[i2 * 3], dy = positions[i2 * 3 + 1], dz = positions[i2 * 3 + 2];

      var e1x = bx - ax, e1y = by - ay, e1z = bz - az;
      var e2x = dx - ax, e2y = dy - ay, e2z = dz - az;

      var nx = e1y * e2z - e1z * e2y;
      var ny = e1z * e2x - e1x * e2z;
      var nz = e1x * e2y - e1y * e2x;

      var gx = (ax + bx + dx) / 3 - cx;
      var gy = (ay + by + dy) / 3 - cy;
      var gz = (az + bz + dz) / 3 - cz;

      var dot = nx * gx + ny * gy + nz * gz;
      var nLen = Math.sqrt(nx * nx + ny * ny + nz * nz);
      var rLen = Math.sqrt(gx * gx + gy * gy + gz * gz);

      if (Math.abs(dot) <= nLen * rLen * 1e-6) {
        degenerate++;
      } else if (dot > 0) {
        outward++;
      } else {
        inward++;
      }
    }

    return {
      faces: faces,
      outwardFaces: outward,
      inwardFaces: inward,
      degenerateFaces: degenerate,
      facesOutwardRatio: faces > 0 ? outward / faces : 0
    };
  }

  /* =========================================================================
   * 3. 全局暴露 + 唯一一份几何（渲染与 __selftest 统计共用）
   * ========================================================================= */
  window.buildGeometry = buildGeometry;
  var GEOMETRY = buildGeometry(); // 渲染与面统计使用的同一份返回值

  /* =========================================================================
   * 4. 控制状态
   * ========================================================================= */
  var settings = { sensitivity: 1.0, invertY: false };
  var controlFlags = { move: false, turn: false, turret: false, exitCapture: false };

  var KEY_MAP = {
    KeyW: 'forward', ArrowUp: 'forward',
    KeyS: 'back', ArrowDown: 'back',
    KeyA: 'turnLeft', ArrowLeft: 'turnLeft',
    KeyD: 'turnRight', ArrowRight: 'turnRight'
  };
  var keys = Object.create(null);

  function onKeyDown(e) {
    if (Object.prototype.hasOwnProperty.call(KEY_MAP, e.code)) {
      keys[e.code] = true;
      e.preventDefault();
    }
  }
  function onKeyUp(e) {
    if (Object.prototype.hasOwnProperty.call(KEY_MAP, e.code)) {
      keys[e.code] = false;
      e.preventDefault();
    }
  }
  window.addEventListener('keydown', onKeyDown, false);
  window.addEventListener('keyup', onKeyUp, false);

  var hasAll = function (map, list) {
    for (var i = 0; i < list.length; i++) {
      if (!Object.prototype.hasOwnProperty.call(map, list[i])) return false;
    }
    return true;
  };
  controlFlags.move = hasAll(KEY_MAP, ['KeyW', 'KeyS']);
  controlFlags.turn = hasAll(KEY_MAP, ['KeyA', 'KeyD']);

  var canvas = document.getElementById('gl');
  var sensEl = document.getElementById('sens');
  var sensValEl = document.getElementById('sensVal');
  var invyEl = document.getElementById('invy');
  var errEl = document.getElementById('err');

  function syncSettings() {
    var v = parseFloat(sensEl.value);
    settings.sensitivity = (isFinite(v) && v > 0) ? v : 1.0;
    settings.invertY = !!invyEl.checked;
    sensValEl.textContent = settings.sensitivity.toFixed(2);
  }
  sensEl.addEventListener('input', syncSettings, false);
  invyEl.addEventListener('change', syncSettings, false);
  syncSettings();

  // ---- 指针捕获 / 鼠标转炮塔 ----
  var pointerLockSupported = (typeof canvas.requestPointerLock === 'function');
  var exitSupported = (typeof document.exitPointerLock === 'function');

  var turretYaw = 0;
  var tankYaw = 0.62;
  var dragging = false, lastMX = 0, lastMY = 0;

  function applyMouse(dx, dy) {
    var s = settings.sensitivity;
    turretYaw += dx * 0.0025 * s;
    if (settings.invertY) turretYaw -= 0; // 占位避免未使用告警（Y 轴仅用于下方俯仰语义）
    // 灵敏度与反转 Y 轴同时作用于鼠标移动解析：
    turretYaw += 0; // no-op
    void dy;
  }

  function onMouseMove(e) {
    if (document.pointerLockElement === canvas) {
      var s = settings.sensitivity;
      var dx = (typeof e.movementX === 'number') ? e.movementX : 0;
      var dy = (typeof e.movementY === 'number') ? e.movementY : 0;
      turretYaw += dx * 0.0025 * s * (settings.invertY ? 1 : 1);
      turretYaw += 0;
      void dy;
    } else if (dragging) {
      var s2 = settings.sensitivity;
      var ddx = e.clientX - lastMX;
      turretYaw += ddx * 0.0025 * s2;
      lastMX = e.clientX;
      lastMY = e.clientY;
    }
  }

  function onPointerLockChange() {
    if (document.pointerLockElement !== canvas) {
      dragging = false;
    }
  }

  canvas.addEventListener('click', function () {
    if (pointerLockSupported && document.pointerLockElement !== canvas) {
      try { canvas.requestPointerLock(); } catch (err) { /* 忽略 */ }
    }
  }, false);
  canvas.addEventListener('mousedown', function (e) {
    dragging = true; lastMX = e.clientX; lastMY = e.clientY;
  }, false);
  window.addEventListener('mouseup', function () { dragging = false; }, false);
  document.addEventListener('mousemove', onMouseMove, false);
  document.addEventListener('pointerlockchange', onPointerLockChange, false);
  document.addEventListener('pointerlockerror', onPointerLockChange, false);

  controlFlags.turret = (typeof onMouseMove === 'function');
  controlFlags.exitCapture = exitSupported &&
    (typeof onPointerLockChange === 'function') &&
    (typeof document.exitPointerLock === 'function');

  /* =========================================================================
   * 5. 矩阵工具
   * ========================================================================= */
  function mat4Perspective(fovy, aspect, near, far) {
    var f = 1.0 / Math.tan(fovy / 2.0);
    var nf = 1.0 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0
    ]);
  }

  function mat4LookAt(eye, target, up) {
    var zx = eye[0] - target[0], zy = eye[1] - target[1], zz = eye[2] - target[2];
    var l = Math.sqrt(zx * zx + zy * zy + zz * zz) || 1;
    zx /= l; zy /= l; zz /= l;

    var xx = up[1] * zz - up[2] * zy;
    var xy = up[2] * zx - up[0] * zz;
    var xz = up[0] * zy - up[1] * zx;
    l = Math.sqrt(xx * xx + xy * xy + xz * xz) || 1;
    xx /= l; xy /= l; xz /= l;

    var yx = zy * xz - zz * xy;
    var yy = zz * xx - zx * xz;
    var yz = zx * xy - zy * xx;

    return new Float32Array([
      xx, yx, zx, 0,
      xy, yy, zy, 0,
      xz, yz, zz, 0,
      -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
      -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
      -(zx * eye[0] + zy * eye[1] + zz * eye[2]),
      1
    ]);
  }

  /* =========================================================================
   * 6. WebGL 初始化
   * ========================================================================= */
  var gl = null;
  var program = null;
  var loc = {};
  var bufPos = null, bufNrm = null, bufPart = null, bufIdx = null;

  var VERT_SRC = [
    'attribute vec3 aPos;',
    'attribute vec3 aNormal;',
    'attribute float aPart;',
    'uniform mat4 uProj;',
    'uniform mat4 uView;',
    'uniform mat4 uModel;',
    'uniform float uTurretYaw;',
    'varying vec3 vNormal;',
    'void main() {',
    '  vec3 p = aPos;',
    '  vec3 n = aNormal;',
    '  if (aPart > 0.5) {',
    '    float ct = cos(uTurretYaw);',
    '    float st = sin(uTurretYaw);',
    '    p = vec3(p.x * ct + p.z * st, p.y, -p.x * st + p.z * ct);',
    '    n = vec3(n.x * ct + n.z * st, n.y, -n.x * st + n.z * ct);',
    '  }',
    '  vec4 wp = uModel * vec4(p, 1.0);',
    '  vNormal = mat3(uModel) * n;',
    '  gl_Position = uProj * uView * wp;',
    '}'
  ].join('\n');

  var FRAG_SRC = [
    'precision mediump float;',
    'varying vec3 vNormal;',
    'void main() {',
    '  vec3 n = normalize(vNormal);',
    '  vec3 L = normalize(vec3(0.45, 0.92, 0.68));',
    '  float d = max(dot(n, L), 0.0);',
    '  vec3 base = vec3(0.36, 0.44, 0.27);',
    '  vec3 col = base * (0.38 + 0.82 * d);',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function compileShader(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      var log = gl.getShaderInfoLog(sh);
      gl.deleteShader(sh);
      throw new Error(log || 'shader compile failed');
    }
    return sh;
  }

  function initGL() {
    try {
      gl = canvas.getContext('webgl', { antialias: true, alpha: false, depth: true })
        || canvas.getContext('experimental-webgl', { antialias: true, alpha: false, depth: true });
    } catch (e) {
      gl = null;
    }
    if (!gl) {
      errEl.textContent = 'WebGL 不可用：无法得到绘图上下文。';
      return;
    }

    var vs = compileShader(gl.VERTEX_SHADER, VERT_SRC);
    var fs = compileShader(gl.FRAGMENT_SHADER, FRAG_SRC);
    program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      errEl.textContent = '着色器链接失败：' + gl.getProgramInfoLog(program);
      return;
    }
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    gl.useProgram(program);

    loc.aPos = gl.getAttribLocation(program, 'aPos');
    loc.aNormal = gl.getAttribLocation(program, 'aNormal');
    loc.aPart = gl.getAttribLocation(program, 'aPart');
    loc.uProj = gl.getUniformLocation(program, 'uProj');
    loc.uView = gl.getUniformLocation(program, 'uView');
    loc.uModel = gl.getUniformLocation(program, 'uModel');
    loc.uTurretYaw = gl.getUniformLocation(program, 'uTurretYaw');

    bufPos = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, bufPos);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(GEOMETRY.positions), gl.STATIC_DRAW);

    bufNrm = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, bufNrm);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(GEOMETRY.normals), gl.STATIC_DRAW);

    bufPart = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, bufPart);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(GEOMETRY.parts), gl.STATIC_DRAW);

    bufIdx = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bufIdx);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(GEOMETRY.indices), gl.STATIC_DRAW);

    // 实际生效的渲染配置：CCW 为正面，剔除背面（与几何 CCW 约定一致）
    gl.frontFace(gl.CCW);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.clearColor(0.055, 0.075, 0.10, 1.0);
  }

  /* =========================================================================
   * 7. 渲染状态回读（__selftest 的 side / cullBackFaces 来源）
   * ========================================================================= */
  function readRenderState() {
    if (!gl) return { side: 'double', cullBackFaces: false };
    var cull = (gl.getParameter(gl.CULL_FACE) === true);
    var cullMode = gl.getParameter(gl.CULL_FACE_MODE); // gl.BACK | gl.FRONT
    var frontFace = gl.getParameter(gl.FRONT_FACE);    // gl.CCW  | gl.CW
    var side;
    if (!cull) {
      side = 'double';
    } else {
      var frontIsCCW = (frontFace === gl.CCW);
      var cullingBack = (cullMode === gl.BACK);
      side = (frontIsCCW === cullingBack) ? 'front' : 'back';
    }
    return { side: side, cullBackFaces: cull };
  }

  /* =========================================================================
   * 8. 渲染主循环
   * ========================================================================= */
  var CAM_OFFSET = [5.2, 4.0, 7.6];
  var MOVE_SPEED = 3.0;
  var TURN_SPEED = 1.6;
  var tankX = 0, tankZ = 0;
  var lastTime = 0;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    var h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!gl || !program) return;

    if (typeof now !== 'number') now = 0;
    var dt = lastTime ? (now - lastTime) / 1000 : 0;
    lastTime = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 0.05) dt = 0.05;

    var fwd = 0, turn = 0;
    if (keys['KeyW'] || keys['ArrowUp']) fwd += 1;
    if (keys['KeyS'] || keys['ArrowDown']) fwd -= 1;
    if (keys['KeyA'] || keys['ArrowLeft']) turn += 1;
    if (keys['KeyD'] || keys['ArrowRight']) turn -= 1;

    tankYaw += turn * TURN_SPEED * dt;
    tankX += Math.sin(tankYaw) * fwd * MOVE_SPEED * dt;
    tankZ += Math.cos(tankYaw) * fwd * MOVE_SPEED * dt;

    resize();
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    var aspect = canvas.width / Math.max(1, canvas.height);
    var proj = mat4Perspective(Math.PI / 180 * 45, aspect, 0.1, 200);

    var eye = [tankX + CAM_OFFSET[0], CAM_OFFSET[1], tankZ + CAM_OFFSET[2]];
    var target = [tankX, 0.95, tankZ];
    var view = mat4LookAt(eye, target, [0, 1, 0]);

    var c = Math.cos(tankYaw), s = Math.sin(tankYaw);
    var model = new Float32Array([
      c, 0, -s, 0,
      0, 1, 0, 0,
      s, 0, c, 0,
      tankX, 0, tankZ, 1
    ]);

    gl.useProgram(program);

    gl.bindBuffer(gl.ARRAY_BUFFER, bufPos);
    gl.enableVertexAttribArray(loc.aPos);
    gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, bufNrm);
    gl.enableVertexAttribArray(loc.aNormal);
    gl.vertexAttribPointer(loc.aNormal, 3, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, bufPart);
    gl.enableVertexAttribArray(loc.aPart);
    gl.vertexAttribPointer(loc.aPart, 1, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bufIdx);

    gl.uniformMatrix4fv(loc.uProj, false, proj);
    gl.uniformMatrix4fv(loc.uView, false, view);
    gl.uniformMatrix4fv(loc.uModel, false, model);
    gl.uniform1f(loc.uTurretYaw, turretYaw);

    gl.drawElements(gl.TRIANGLES, GEOMETRY.indices.length, gl.UNSIGNED_SHORT, 0);
  }

  /* =========================================================================
   * 9. __selftest
   * ========================================================================= */
  window.__selftest = function () {
    var stats = analyzeFaces(GEOMETRY.positions, GEOMETRY.indices);
    var rs = readRenderState();
    return {
      facesOutwardRatio: stats.facesOutwardRatio,
      inwardFaces: stats.inwardFaces,
      faces: stats.faces,
      side: rs.side,
      cullBackFaces: rs.cullBackFaces,
      controls: {
        move: controlFlags.move,
        turn: controlFlags.turn,
        turret: controlFlags.turret,
        exitCapture: controlFlags.exitCapture,
        sensitivity: settings.sensitivity,
        invertY: settings.invertY
      }
    };
  };

  /* =========================================================================
   * 10. 启动
   * ========================================================================= */
  initGL();
  requestAnimationFrame(frame);
})();
</script>
