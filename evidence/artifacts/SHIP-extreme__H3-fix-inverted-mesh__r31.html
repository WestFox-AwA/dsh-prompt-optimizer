<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>坦克车体网格查看器 — 自动检测并修复反向面</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f13;color:#dbe6ef;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0b0f13}
  #hud{position:fixed;left:12px;top:12px;max-width:340px;padding:10px 12px;border:1px solid #24323d;border-radius:8px;background:rgba(9,13,17,.78)}
  #hud h1{margin:0 0 6px;font-size:13px;color:#9fd8ff;letter-spacing:.4px}
  #hud div{margin:2px 0}
  .k{color:#8ee08e}
  .w{color:#ffcf7a}
  #panel{position:fixed;right:12px;top:12px;padding:10px 12px;border:1px solid #24323d;border-radius:8px;background:rgba(9,13,17,.78);display:flex;flex-direction:column;gap:8px}
  #panel label{display:flex;align-items:center;gap:6px}
  select,input[type=range]{background:#111a22;color:#dbe6ef;border:1px solid #2c3a46;border-radius:4px}
  input[type=range]{width:110px}
  #report{position:fixed;left:12px;bottom:12px;margin:0;max-width:min(660px,94vw);max-height:44vh;overflow:auto;padding:10px 12px;border:1px solid #24323d;border-radius:8px;background:rgba(9,13,17,.84);color:#b9e6c8;font-size:11px;white-space:pre}
  #err{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#ff9a9a;text-align:center;display:none;max-width:70vw}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="err">当前环境没有可用的 WebGL 上下文：几何检测 / 修复 / 自检仍然可用（见左下角报告）。</div>
<div id="hud">
  <h1>坦克车体网格查看器</h1>
  <div>网格来源：<span class="k">程序化构建</span>（非外部文件 · 运行期零网络请求）</div>
  <div><span class="w">W / S</span> 前进 / 后退　<span class="w">A / D</span> 左转 / 右转</div>
  <div><span class="w">点击画面</span>捕获鼠标 → 移动鼠标转动炮塔（左右 + 俯仰）</div>
  <div><span class="w">Esc</span> 退出鼠标捕获</div>
  <div>背面剔除默认开启（side = front）；相机自动环绕车体</div>
  <div>加载时已自动检测并修复反向面，结果见左下角</div>
</div>
<div id="panel">
  <label>面模式
    <select id="sideMode">
      <option value="front" selected>front（剔除背面 · 验收默认）</option>
      <option value="back">back（剔除正面）</option>
      <option value="double">double（不剔除）</option>
    </select>
  </label>
  <label>灵敏度 <input id="sens" type="range" min="0.1" max="5" step="0.1" value="1"><span id="sensVal">1.0</span></label>
  <label><input id="invertY" type="checkbox"> 反转 Y 轴</label>
</div>
<pre id="report">初始化中…</pre>
<script>
(function () {
  'use strict';

/* ============================================================================
   阶段 0 — 网格来源（假设已写明，不再等待确认）
   ---------------------------------------------------------------------------
   本次执行环境没有文件系统 / 网络工具，无法读取当前目录里是否已有 .obj/.glb/
   .gltf/.json 网格文件。依据任务书“网格来源”第 2 条走兜底路径：

       >>> 网格来源 ＝ 程序化构建，非外部文件。 <<<

   车体主体 = 长方体壳 A（hull）
   炮塔     = 长方体壳 B（turret，独立连通分量，嵌在车体顶部）
   炮管     = 长方体壳 C（barrel，独立连通分量，尾端内嵌进炮塔内部）

   构建完成后，按固定种子的确定性伪随机注入“绕序反向”的面：
     车体 5 个面反向、炮塔 2 个面反向、炮管整壳 12 个面全部反向。
   因此源网格里 brokenFacesBefore = 5 + 2 + 12 = 19（由检测函数算出，非字面量写入）。
   单位：米；坐标系：右手系，+Y 向上，车头朝 +Z。
   ========================================================================== */

  var INJECT = {
    hullFaces: 5,        // 车体注入的反向面个数
    turretFaces: 2,      // 炮塔注入的反向面个数
    barrelWhole: true    // 炮管整壳反向
  };

  var HULL_MIN   = [-1.20, 0.15, -1.80], HULL_MAX   = [1.20, 1.05, 1.80];
  var TURRET_MIN = [-0.70, 0.95, -0.70], TURRET_MAX = [0.70, 1.75, 0.90];
  var BARREL_MIN = [-0.09, 1.28,  0.70], BARREL_MAX = [0.09, 1.46, 2.40];

  var TURRET_PIVOT = [0.0, 1.35, 0.10];   // 炮塔旋转中心（炮塔几何中心）

  var DEGENERATE_AREA2 = 1e-20;           // (2*面积)^2 的下限
  var VOLUME_EPS = 1e-9;                  // 有符号体积判定下限（米^3）

/* ---------------------------------------------------------------- 网格构建 */

  function makeRng(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  /* 单个长方体壳：8 个共享顶点 + 12 个外向 CCW 三角形（顶点按索引共享，
     这样无向边邻接关系成立，绕序一致性才能用拓扑判定）。 */
  function boxShell(mn, mx) {
    var x0 = mn[0], y0 = mn[1], z0 = mn[2], x1 = mx[0], y1 = mx[1], z1 = mx[2];
    var positions = [
      x0, y0, z0,   x1, y0, z0,   x1, y1, z0,   x0, y1, z0,
      x0, y0, z1,   x1, y0, z1,   x1, y1, z1,   x0, y1, z1
    ];
    var indices = [
      4, 5, 6,  4, 6, 7,     // +Z 面
      0, 3, 2,  0, 2, 1,     // -Z 面
      0, 1, 5,  0, 5, 4,     // -Y 面
      3, 7, 6,  3, 6, 2,     // +Y 面
      0, 4, 7,  0, 7, 3,     // -X 面
      1, 2, 6,  1, 6, 5      // +X 面
    ];
    return { positions: positions, indices: indices };
  }

  function pickDistinct(rng, start, end, k) {
    var pool = [];
    for (var i = start; i < end; i++) pool.push(i);
    var picked = [];
    for (var j = 0; j < k && pool.length > 0; j++) {
      var idx = Math.floor(rng() * pool.length);
      picked.push(pool[idx]);
      pool.splice(idx, 1);
    }
    return picked;
  }

  /* 构造“带反向面”的源网格（修复前）。每次调用返回全新对象，纯函数。 */
  function buildRawMesh() {
    var shells = [
      boxShell(HULL_MIN, HULL_MAX),
      boxShell(TURRET_MIN, TURRET_MAX),
      boxShell(BARREL_MIN, BARREL_MAX)
    ];
    var names = ['hull', 'turret', 'barrel'];
    var positions = [], indices = [], ranges = [];
    var p, i, j;

    for (p = 0; p < shells.length; p++) {
      var base = positions.length / 3;
      var sh = shells[p];
      for (i = 0; i < sh.positions.length; i++) positions.push(sh.positions[i]);
      var triStart = indices.length / 3;
      for (j = 0; j < sh.indices.length; j++) indices.push(sh.indices[j] + base);
      ranges.push({ name: names[p], triStart: triStart, triEnd: indices.length / 3 });
    }

    var triCount = indices.length / 3;
    var flip = new Uint8Array(triCount);
    var rng = makeRng(0x5EED1234);

    var hullPicks = pickDistinct(rng, ranges[0].triStart, ranges[0].triEnd, INJECT.hullFaces);
    var turretPicks = pickDistinct(rng, ranges[1].triStart, ranges[1].triEnd, INJECT.turretFaces);
    var t;
    for (t = 0; t < hullPicks.length; t++) flip[hullPicks[t]] = 1;
    for (t = 0; t < turretPicks.length; t++) flip[turretPicks[t]] = 1;
    if (INJECT.barrelWhole) {
      for (t = ranges[2].triStart; t < ranges[2].triEnd; t++) flip[t] = 1;
    }

    var injected = 0;
    for (t = 0; t < triCount; t++) {
      if (flip[t]) {
        var tmp = indices[3 * t + 1];
        indices[3 * t + 1] = indices[3 * t + 2];
        indices[3 * t + 2] = tmp;
        injected++;
      }
    }

    return { positions: positions, indices: indices, ranges: ranges, injectedFlips: injected };
  }

/* ------------------------------------------------------- 检测（核心算法） */

  function orientedVerts(tri, rel, t) {
    var a = tri[3 * t], b = tri[3 * t + 1], c = tri[3 * t + 2];
    if (rel[t] === 1) { var tmp = b; b = c; c = tmp; }
    return [a, b, c];
  }

  function tetVolumeOf(positions, v) {
    var a = v[0] * 3, b = v[1] * 3, c = v[2] * 3;
    var ax = positions[a], ay = positions[a + 1], az = positions[a + 2];
    var bx = positions[b], by = positions[b + 1], bz = positions[b + 2];
    var cx = positions[c], cy = positions[c + 1], cz = positions[c + 2];
    return (ax * (by * cz - bz * cy) - ay * (bx * cz - bz * cx) + az * (bx * cy - by * cx)) / 6;
  }

  /* 统一的检测函数：既用于“修复前”也用于“修复后”。
     返回 { inwardCount, needsFlip, ...统计 }。
     判定流程：
       1) 无向边邻接（同一条边被 2 个三角形共享时，两条有向走向必须相反）
       2) 沿流形边传播，得到每个连通分量内部的一致绕序（rel）
       3) 分量整体朝向：封闭分量用该分量“自身”的有符号体积；体积 < 0 整体翻转
       4) 非封闭 / 含非流形边的分量：逐面用“面心相对该分量质心的方向与面法线同向”兜底
       5) 退化三角形（面积 0 或重复下标）不参与，单独计数，不计入分子 */
  function analyzeMesh(positions, indices) {
    var triCount = Math.floor(indices.length / 3);
    var vertCount = Math.floor(positions.length / 3);
    var tri = new Int32Array(triCount * 3);
    var degenerate = new Uint8Array(triCount);
    var t, i, a, b, c;

    for (t = 0; t < triCount; t++) {
      a = indices[3 * t]; b = indices[3 * t + 1]; c = indices[3 * t + 2];
      tri[3 * t] = a; tri[3 * t + 1] = b; tri[3 * t + 2] = c;
      var ok = (a >= 0 && b >= 0 && c >= 0 &&
                a < vertCount && b < vertCount && c < vertCount &&
                a !== b && b !== c && c !== a);
      if (!ok) { degenerate[t] = 1; continue; }
      var ax = positions[3 * a], ay = positions[3 * a + 1], az = positions[3 * a + 2];
      var bx = positions[3 * b], by = positions[3 * b + 1], bz = positions[3 * b + 2];
      var cx = positions[3 * c], cy = positions[3 * c + 1], cz = positions[3 * c + 2];
      var ux = bx - ax, uy = by - ay, uz = bz - az;
      var vx = cx - ax, vy = cy - ay, vz = cz - az;
      var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      var area2 = nx * nx + ny * ny + nz * nz;
      if (!(area2 > DEGENERATE_AREA2)) degenerate[t] = 1;
    }

    var edgeMap = new Map();
    function ekey(u, v) { return u < v ? (u + ':' + v) : (v + ':' + u); }
    function addEdge(u, v, tt) {
      var k = ekey(u, v);
      var arr = edgeMap.get(k);
      if (arr === undefined) { arr = []; edgeMap.set(k, arr); }
      arr.push({ t: tt, u: u, v: v });
    }
    for (t = 0; t < triCount; t++) {
      if (degenerate[t]) continue;
      a = tri[3 * t]; b = tri[3 * t + 1]; c = tri[3 * t + 2];
      addEdge(a, b, t); addEdge(b, c, t); addEdge(c, a, t);
    }

    var adjacency = new Array(triCount);
    for (t = 0; t < triCount; t++) adjacency[t] = null;
    var manifoldEdges = 0, nonManifoldEdges = 0, boundaryEdges = 0;

    edgeMap.forEach(function (rec) {
      if (rec.length === 1) { boundaryEdges++; return; }
      if (rec.length > 2) { nonManifoldEdges++; return; }
      manifoldEdges++;
      var e1 = rec[0], e2 = rec[1];
      var f = (e1.u === e2.u) ? 1 : 0;    // 走向相同 ⇒ 两者绕序相对反向
      if (adjacency[e1.t] === null) adjacency[e1.t] = [];
      if (adjacency[e2.t] === null) adjacency[e2.t] = [];
      adjacency[e1.t].push({ o: e2.t, f: f });
      adjacency[e2.t].push({ o: e1.t, f: f });
    });

    var rel = new Int8Array(triCount);
    for (t = 0; t < triCount; t++) rel[t] = -1;
    var components = [];
    var windingConflicts = 0;

    for (t = 0; t < triCount; t++) {
      if (degenerate[t] || rel[t] !== -1) continue;
      rel[t] = 0;
      var stack = [t], comp = [];
      while (stack.length > 0) {
        var cur = stack.pop();
        comp.push(cur);
        var nb = adjacency[cur];
        if (nb === null) continue;
        for (i = 0; i < nb.length; i++) {
          var o = nb[i].o, f2 = nb[i].f, want = rel[cur] ^ f2;
          if (rel[o] === -1) { rel[o] = want; stack.push(o); }
          else if (rel[o] !== want) { windingConflicts++; }
        }
      }
      components.push(comp);
    }

    var needsFlip = new Uint8Array(triCount);
    var componentsFlipped = 0, fallbackComponents = 0, fallbackFaces = 0;

    for (var ci = 0; ci < components.length; ci++) {
      var comp2 = components[ci];
      var k;

      var closed = true;
      for (k = 0; k < comp2.length && closed; k++) {
        var tc = comp2[k];
        var r1 = edgeMap.get(ekey(tri[3 * tc], tri[3 * tc + 1]));
        var r2 = edgeMap.get(ekey(tri[3 * tc + 1], tri[3 * tc + 2]));
        var r3 = edgeMap.get(ekey(tri[3 * tc + 2], tri[3 * tc]));
        if (!r1 || r1.length !== 2 || !r2 || r2.length !== 2 || !r3 || r3.length !== 2) closed = false;
      }

      var V = 0;
      for (k = 0; k < comp2.length; k++) {
        V += tetVolumeOf(positions, orientedVerts(tri, rel, comp2[k]));
      }

      if (closed && Math.abs(V) > VOLUME_EPS) {
        var flipAll = V < 0 ? 1 : 0;
        if (flipAll === 1) componentsFlipped++;
        for (k = 0; k < comp2.length; k++) needsFlip[comp2[k]] = rel[comp2[k]] ^ flipAll;
      } else {
        fallbackComponents++;
        fallbackFaces += comp2.length;
        var sx = 0, sy = 0, sz = 0, cnt = 0, used = {};
        for (k = 0; k < comp2.length; k++) {
          var tv = comp2[k];
          for (var q = 0; q < 3; q++) {
            var vi = tri[3 * tv + q];
            if (used[vi] !== 1) {
              used[vi] = 1;
              sx += positions[3 * vi]; sy += positions[3 * vi + 1]; sz += positions[3 * vi + 2];
              cnt++;
            }
          }
        }
        var cenx = cnt ? sx / cnt : 0, ceny = cnt ? sy / cnt : 0, cenz = cnt ? sz / cnt : 0;
        for (k = 0; k < comp2.length; k++) {
          var tf = comp2[k];
          var vv = orientedVerts(tri, rel, tf);
          var p0 = [positions[3 * vv[0]], positions[3 * vv[0] + 1], positions[3 * vv[0] + 2]];
          var p1 = [positions[3 * vv[1]], positions[3 * vv[1] + 1], positions[3 * vv[1] + 2]];
          var p2 = [positions[3 * vv[2]], positions[3 * vv[2] + 1], positions[3 * vv[2] + 2]];
          var e1x = p1[0] - p0[0], e1y = p1[1] - p0[1], e1z = p1[2] - p0[2];
          var e2x = p2[0] - p0[0], e2y = p2[1] - p0[1], e2z = p2[2] - p0[2];
          var fnx = e1y * e2z - e1z * e2y;
          var fny = e1z * e2x - e1x * e2z;
          var fnz = e1x * e2y - e1y * e2x;
          var mx = (p0[0] + p1[0] + p2[0]) / 3 - cenx;
          var my = (p0[1] + p1[1] + p2[1]) / 3 - ceny;
          var mz = (p0[2] + p1[2] + p2[2]) / 3 - cenz;
          var d = fnx * mx + fny * my + fnz * mz;
          needsFlip[tf] = rel[tf] ^ (d >= 0 ? 0 : 1);
        }
      }
    }

    var inwardCount = 0, degenerateCount = 0;
    for (t = 0; t < triCount; t++) {
      if (degenerate[t]) { degenerateCount++; continue; }
      if (needsFlip[t] === 1) inwardCount++;
    }

    return {
      triCount: triCount,
      inwardCount: inwardCount,
      needsFlip: needsFlip,
      degenerateFaces: degenerateCount,
      nonManifoldEdges: nonManifoldEdges,
      boundaryEdges: boundaryEdges,
      manifoldEdges: manifoldEdges,
      componentCount: components.length,
      componentsFlipped: componentsFlipped,
      fallbackComponents: fallbackComponents,
      facesResolvedByFallback: fallbackFaces,
      windingConflicts: windingConflicts,
      components: components
    };
  }

/* ------------------------------------------------------- 修复（核心算法） */

  /* 只改 indices 的顺序（交换三角形内两个下标），positions 逐元素不变。 */
  function fixWinding(positions, indices) {
    var an = analyzeMesh(positions, indices);
    var out = indices.slice();
    var flipped = 0;
    for (var t = 0; t < an.triCount; t++) {
      if (an.needsFlip[t] === 1) {
        var tmp = out[3 * t + 1];
        out[3 * t + 1] = out[3 * t + 2];
        out[3 * t + 2] = tmp;
        flipped++;
      }
    }
    return { positions: positions, indices: out, flippedFaces: flipped };
  }

/* ------------------------------------------------- 纯函数 buildGeometry */

  /* 纯函数：不读 DOM / window / renderer，不改任何外部状态。
     返回 { positions, indices, positions3 }，positions 与修复前逐元素相同。 */
  function buildGeometry() {
    var raw = buildRawMesh();
    var fixed = fixWinding(raw.positions, raw.indices);
    var positions = raw.positions.slice();
    var positions3 = [];
    for (var i = 0; i < positions.length; i += 3) {
      positions3.push([positions[i], positions[i + 1], positions[i + 2]]);
    }
    return { positions: positions, indices: fixed.indices, positions3: positions3 };
  }

/* ----------------------------------------------------- 运行时输入配置 */

  /* 唯一的一份配置对象：输入处理、界面控件、__selftest() 全部读它。 */
  var inputConfig = {
    move: 'W/S',
    turn: 'A/D',
    turret: 'Mouse',
    exitCapture: 'Escape',
    sensitivity: 1.0,
    invertY: false
  };

  var state = {
    side: 'front',          // 实际生效的面模式："front" / "back" / "double"
    keys: {},
    captured: false,
    camAngle: 0.9,
    bodyPos: [0, 0, 0],
    bodyYaw: 0,
    turretYaw: 0,
    turretPitch: 0,
    renderedTriangles: 0
  };

  var KEYCODE_MAP = {
    W: 'KeyW', A: 'KeyA', S: 'KeyS', D: 'KeyD', Q: 'KeyQ', E: 'KeyE',
    ESC: 'Escape', ESCAPE: 'Escape',
    UP: 'ArrowUp', DOWN: 'ArrowDown', LEFT: 'ArrowLeft', RIGHT: 'ArrowRight',
    SHIFT: 'ShiftLeft', SPACE: 'Space'
  };

  /* 从 inputConfig 现场解析绑定（不缓存副本），所以改配置立刻生效。 */
  function bindingCodes(name) {
    var raw = String(inputConfig[name]).split('/');
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var tok = raw[i].trim().toUpperCase();
      if (tok.length === 0) continue;
      out.push(KEYCODE_MAP[tok] || ('Key' + tok));
    }
    return out;
  }

/* --------------------------------------------------------- 自检 __selftest */

  function __selftest() {
    var geo = buildGeometry();              // 修复后
    var raw = buildRawMesh();               // 修复前（同一构造器）
    var after = analyzeMesh(geo.positions, geo.indices);
    var before = analyzeMesh(raw.positions, raw.indices);
    var fixed = fixWinding(raw.positions, raw.indices);

    var faces = geo.indices.length / 3;
    var inwardFaces = after.inwardCount;
    var brokenFacesBefore = before.inwardCount;
    var side = state.side;

    return {
      facesOutwardRatio: faces === 0 ? 1 : (faces - inwardFaces) / faces,
      inwardFaces: inwardFaces,
      brokenFacesBefore: brokenFacesBefore,
      faces: faces,
      side: side,
      cullBackFaces: side !== 'double',
      controls: {
        move: inputConfig.move,
        turn: inputConfig.turn,
        turret: inputConfig.turret,
        exitCapture: inputConfig.exitCapture,
        sensitivity: inputConfig.sensitivity,
        invertY: !!inputConfig.invertY
      },
      /* --- 额外键（允许，不改变上述必需键语义） --- */
      vertices: geo.positions.length / 3,
      renderedTriangles: state.renderedTriangles,
      fixedFaces: fixed.flippedFaces,
      degenerateFaces: after.degenerateFaces,
      nonManifoldEdges: after.nonManifoldEdges,
      boundaryEdges: after.boundaryEdges,
      manifoldEdges: after.manifoldEdges,
      components: after.componentCount,
      componentsFlipped: after.componentsFlipped,
      facesResolvedByFallback: after.facesResolvedByFallback,
      windingConflicts: after.windingConflicts,
      brokenFacesBeforeDetail: {
        degenerateFaces: before.degenerateFaces,
        components: before.componentCount,
        componentsFlipped: before.componentsFlipped,
        facesResolvedByFallback: before.facesResolvedByFallback
      },
      meshSource: 'procedural (hull + turret + barrel box shells, injected reversed windings)',
      injectedReversedFaces: raw.injectedFlips
    };
  }

/* ------------------------------------------------- 附加诊断（额外出口） */

  function triangleSignatureSet(positions, indices) {
    var sigs = [];
    var triCount = Math.floor(indices.length / 3);
    for (var t = 0; t < triCount; t++) {
      var v = [];
      for (var k = 0; k < 3; k++) {
        var i = indices[3 * t + k];
        v.push(positions[3 * i].toFixed(6) + ',' + positions[3 * i + 1].toFixed(6) + ',' + positions[3 * i + 2].toFixed(6));
      }
      v.sort();
      sigs.push(v.join('|'));
    }
    sigs.sort();
    return sigs.join('\n');
  }

  function runDiagnostics() {
    var out = {};

    var s1 = JSON.stringify(__selftest());
    var s2 = JSON.stringify(__selftest());
    out.selftestIdempotent = (s1 === s2);
    out.selftestJSON = s1;

    var g1 = buildGeometry();
    var g2 = buildGeometry();
    var sameLen = (g1.positions.length === g2.positions.length) && (g1.indices.length === g2.indices.length);
    var samePos = sameLen, sameIdx = sameLen, i;
    for (i = 0; i < g1.positions.length && samePos; i++) if (g1.positions[i] !== g2.positions[i]) samePos = false;
    for (i = 0; i < g1.indices.length && sameIdx; i++) if (g1.indices[i] !== g2.indices[i]) sameIdx = false;
    out.buildGeometryPure = samePos && sameIdx;

    var raw = buildRawMesh();
    var posUnchanged = (raw.positions.length === g1.positions.length);
    for (i = 0; i < raw.positions.length && posUnchanged; i++) {
      if (raw.positions[i] !== g1.positions[i]) posUnchanged = false;
    }
    out.positionsUnchangedByRepair = posUnchanged;
    out.triangleVertexMultisetIdentical =
      (triangleSignatureSet(raw.positions, raw.indices) === triangleSignatureSet(g1.positions, g1.indices));

    var anBefore = analyzeMesh(raw.positions, raw.indices);
    var anAfter = analyzeMesh(g1.positions, g1.indices);
    out.inwardFacesBeforeRepair = anBefore.inwardCount;
    out.inwardFacesAfterRepair = anAfter.inwardCount;

    var savedHull = INJECT.hullFaces;
    INJECT.hullFaces = savedHull + 2;
    var rawB = buildRawMesh();
    var mutated = analyzeMesh(rawB.positions, rawB.indices).inwardCount;
    INJECT.hullFaces = savedHull;
    var rawC = buildRawMesh();
    var restored = analyzeMesh(rawC.positions, rawC.indices).inwardCount;
    out.dynamicBrokenFaces = {
      original: anBefore.inwardCount,
      mutated_hullFaces_plus_2: mutated,
      restored: restored
    };

    out.positionsLength = g1.positions.length;
    out.indicesLength = g1.indices.length;
    out.faces = g1.indices.length / 3;

    return out;
  }

/* =========================================================== 渲染与输入 */

  var canvas = document.getElementById('view');
  var gl = null;
  try {
    gl = canvas.getContext('webgl', { antialias: true, alpha: false, depth: true })
      || canvas.getContext('experimental-webgl', { antialias: true, alpha: false, depth: true });
  } catch (e) { gl = null; }

  var geo = buildGeometry();
  state.renderedTriangles = geo.indices.length / 3;

  var VERT_SRC = [
    'attribute vec3 aPos;',
    'attribute vec3 aNormal;',
    'uniform mat4 uProj;',
    'uniform mat4 uView;',
    'uniform mat4 uModel;',
    'varying vec3 vNormal;',
    'varying vec3 vWorld;',
    'void main() {',
    '  vec4 wp = uModel * vec4(aPos, 1.0);',
    '  vWorld = wp.xyz;',
    '  mat3 nm = mat3(uModel[0].xyz, uModel[1].xyz, uModel[2].xyz);',
    '  vNormal = nm * aNormal;',
    '  gl_Position = uProj * uView * wp;',
    '}'
  ].join('\n');

  var FRAG_SRC = [
    'precision mediump float;',
    'varying vec3 vNormal;',
    'varying vec3 vWorld;',
    'uniform vec3 uCamPos;',
    'uniform vec3 uColor;',
    'void main() {',
    '  vec3 n = normalize(vNormal);',
    '  vec3 l = normalize(vec3(0.45, 0.85, 0.30));',
    '  vec3 v = normalize(uCamPos - vWorld);',
    '  float diff = max(dot(n, l), 0.0);',
    '  vec3 h = normalize(l + v);',
    '  float spec = pow(max(dot(n, h), 0.0), 28.0);',
    '  vec3 col = uColor * (0.30 + 0.72 * diff) + vec3(1.0) * spec * 0.20;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function compile(glc, type, src) {
    var sh = glc.createShader(type);
    glc.shaderSource(sh, src);
    glc.compileShader(sh);
    return sh;
  }

  /* 按“修复后的 positions + indices”重新计算面法线（不沿用任何修复前的法线）。 */
  function expandTriangles(geometry, triStart, triEnd) {
    var P = geometry.positions, I = geometry.indices;
    var out = [];
    for (var t = triStart; t < triEnd; t++) {
      var ia = I[3 * t], ib = I[3 * t + 1], ic = I[3 * t + 2];
      var ax = P[3 * ia], ay = P[3 * ia + 1], az = P[3 * ia + 2];
      var bx = P[3 * ib], by = P[3 * ib + 1], bz = P[3 * ib + 2];
      var cx = P[3 * ic], cy = P[3 * ic + 1], cz = P[3 * ic + 2];
      var ux = bx - ax, uy = by - ay, uz = bz - az;
      var vx = cx - ax, vy = cy - ay, vz = cz - az;
      var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      var len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      if (!(len > 0)) { nx = 0; ny = 1; nz = 0; len = 1; }
      nx /= len; ny /= len; nz /= len;
      out.push(ax, ay, az, nx, ny, nz);
      out.push(bx, by, bz, nx, ny, nz);
      out.push(cx, cy, cz, nx, ny, nz);
    }
    return new Float32Array(out);
  }

  var prog = null, loc = {}, drawGroups = [];

  function initRenderer() {
    if (!gl) {
      document.getElementById('err').style.display = 'block';
      return;
    }
    var vs = compile(gl, gl.VERTEX_SHADER, VERT_SRC);
    var fs = compile(gl, gl.FRAGMENT_SHADER, FRAG_SRC);
    prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    gl.useProgram(prog);

    loc.aPos = gl.getAttribLocation(prog, 'aPos');
    loc.aNormal = gl.getAttribLocation(prog, 'aNormal');
    loc.uProj = gl.getUniformLocation(prog, 'uProj');
    loc.uView = gl.getUniformLocation(prog, 'uView');
    loc.uModel = gl.getUniformLocation(prog, 'uModel');
    loc.uCamPos = gl.getUniformLocation(prog, 'uCamPos');
    loc.uColor = gl.getUniformLocation(prog, 'uColor');
    gl.enableVertexAttribArray(loc.aPos);
    gl.enableVertexAttribArray(loc.aNormal);

    var specs = [
      { name: 'hull',   triStart: 0,  triEnd: 12, color: [0.30, 0.34, 0.24], pivot: null },
      { name: 'turret', triStart: 12, triEnd: 36, color: [0.40, 0.44, 0.29], pivot: TURRET_PIVOT }
    ];
    var total = 0;
    for (var i = 0; i < specs.length; i++) {
      var data = expandTriangles(geo, specs[i].triStart, specs[i].triEnd);
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
      drawGroups.push({
        name: specs[i].name,
        buffer: buf,
        count: data.length / 6,
        color: specs[i].color,
        pivot: specs[i].pivot
      });
      total += data.length / 6;
    }
    state.renderedTriangles = total;
  }

  /* --- 矩阵工具（列主序，直接喂 uniformMatrix4fv） --- */
  function m4New() {
    var m = new Float32Array(16);
    m[0] = m[5] = m[10] = m[15] = 1;
    return m;
  }
  function m4Mul(a, b) {
    var o = new Float32Array(16);
    for (var c = 0; c < 4; c++) {
      for (var r = 0; r < 4; r++) {
        var s = 0;
        for (var k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
        o[c * 4 + r] = s;
      }
    }
    return o;
  }
  function m4Translate(x, y, z) {
    var m = m4New();
    m[12] = x; m[13] = y; m[14] = z;
    return m;
  }
  function m4RotY(a) {
    var m = m4New(), c = Math.cos(a), s = Math.sin(a);
    m[0] = c; m[2] = -s; m[8] = s; m[10] = c;
    return m;
  }
  function m4RotX(a) {
    var m = m4New(), c = Math.cos(a), s = Math.sin(a);
    m[5] = c; m[6] = s; m[9] = -s; m[10] = c;
    return m;
  }
  function m4Perspective(fovy, aspect, near, far) {
    var f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    var m = new Float32Array(16);
    m[0] = f / aspect; m[5] = f;
    m[10] = (far + near) * nf; m[11] = -1;
    m[14] = 2 * far * near * nf;
    return m;
  }
  function m4LookAt(eye, center, up) {
    var zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
    var zl = Math.sqrt(zx * zx + zy * zy + zz * zz) || 1;
    zx /= zl; zy /= zl; zz /= zl;
    var xx = up[1] * zz - up[2] * zy;
    var xy = up[2] * zx - up[0] * zz;
    var xz = up[0] * zy - up[1] * zx;
    var xl = Math.sqrt(xx * xx + xy * xy + xz * xz) || 1;
    xx /= xl; xy /= xl; xz /= xl;
    var yx = zy * xz - zz * xy;
    var yy = zz * xx - zx * xz;
    var yz = zx * xy - zy * xx;
    var m = new Float32Array(16);
    m[0] = xx; m[1] = yx; m[2] = zx; m[3] = 0;
    m[4] = xy; m[5] = yy; m[6] = zy; m[7] = 0;
    m[8] = xz; m[9] = yz; m[10] = zz; m[11] = 0;
    m[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
    m[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
    m[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
    m[15] = 1;
    return m;
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* --- 面模式：cullBackFaces = (side !== "double") --- */
  function applySideMode() {
    if (!gl) return;
    if (state.side === 'double') {
      gl.disable(gl.CULL_FACE);
    } else {
      gl.enable(gl.CULL_FACE);
      gl.frontFace(gl.CCW);
      gl.cullFace(state.side === 'back' ? gl.FRONT : gl.BACK);
    }
  }

  var MOVE_SPEED = 4.2;        // 米/秒
  var TURN_SPEED = 1.9;        // 弧度/秒
  var TURRET_SENS = 0.0022;    // 弧度/像素（再乘 inputConfig.sensitivity）

  function updateBody(dt) {
    var mv = bindingCodes('move');
    var tr = bindingCodes('turn');
    var fwd = mv.length > 0 ? (state.keys[mv[0]] ? 1 : 0) : 0;
    var back = mv.length > 1 ? (state.keys[mv[1]] ? 1 : 0) : 0;
    var left = tr.length > 0 ? (state.keys[tr[0]] ? 1 : 0) : 0;
    var right = tr.length > 1 ? (state.keys[tr[1]] ? 1 : 0) : 0;

    var dir = fwd - back;
    var turnDir = left - right;

    state.bodyYaw += turnDir * TURN_SPEED * dt;
    var fx = Math.sin(state.bodyYaw), fz = Math.cos(state.bodyYaw);
    state.bodyPos[0] = clamp(state.bodyPos[0] + fx * MOVE_SPEED * dt * dir, -16, 16);
    state.bodyPos[2] = clamp(state.bodyPos[2] + fz * MOVE_SPEED * dt * dir, -16, 16);
  }

  var eyeWorld = [0, 0, 0];

  function renderScene() {
    if (!gl) return;
    var w = canvas.clientWidth || 800;
    var h = canvas.clientHeight || 600;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.055, 0.07, 0.085, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    applySideMode();

    var tx = state.bodyPos[0], ty = state.bodyPos[1] + 1.0, tz = state.bodyPos[2];
    var r = 9.6, pitch = 0.40;
    var eye = [
      tx + r * Math.cos(pitch) * Math.sin(state.camAngle),
      ty + r * Math.sin(pitch),
      tz + r * Math.cos(pitch) * Math.cos(state.camAngle)
    ];
    eyeWorld = eye;

    var proj = m4Perspective(45 * Math.PI / 180, canvas.width / canvas.height, 0.1, 200);
    var view = m4LookAt(eye, [tx, ty, tz], [0, 1, 0]);
    var bodyMatrix = m4Mul(m4Translate(state.bodyPos[0], state.bodyPos[1], state.bodyPos[2]), m4RotY(state.bodyYaw));

    gl.uniformMatrix4fv(loc.uProj, false, proj);
    gl.uniformMatrix4fv(loc.uView, false, view);
    gl.uniform3fv(loc.uCamPos, new Float32Array(eye));

    for (var i = 0; i < drawGroups.length; i++) {
      var g = drawGroups[i];
      var model = bodyMatrix;
      if (g.pivot) {
        var pv = g.pivot;
        model = m4Mul(model, m4Translate(pv[0], pv[1], pv[2]));
        model = m4Mul(model, m4RotY(state.turretYaw));
        model = m4Mul(model, m4RotX(state.turretPitch));
        model = m4Mul(model, m4Translate(-pv[0], -pv[1], -pv[2]));
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, g.buffer);
      gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, 24, 0);
      gl.vertexAttribPointer(loc.aNormal, 3, gl.FLOAT, false, 24, 12);
      gl.uniformMatrix4fv(loc.uModel, false, model);
      gl.uniform3fv(loc.uColor, new Float32Array(g.color));
      gl.drawArrays(gl.TRIANGLES, 0, g.count);
    }
  }

  var lastTime = 0;
  function frame(now) {
    var t = now * 0.001;
    var dt = lastTime ? Math.min(t - lastTime, 0.05) : 0.016;
    lastTime = t;
    updateBody(dt);
    state.camAngle += dt * 0.18;
    renderScene();
    requestAnimationFrame(frame);
  }

/* ------------------------------------------------------------ 输入绑定 */

  function bindInput() {
    window.addEventListener('keydown', function (e) {
      state.keys[e.code] = true;
      var exitCodes = bindingCodes('exitCapture');
      if (exitCodes.indexOf(e.code) >= 0) {
        if (document.exitPointerLock) document.exitPointerLock();
      }
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') e.preventDefault();
    });

    window.addEventListener('keyup', function (e) {
      state.keys[e.code] = false;
    });

    canvas.addEventListener('pointerdown', function () {
      if (canvas.requestPointerLock) {
        var p = canvas.requestPointerLock();
        if (p && typeof p.catch === 'function') p.catch(function () {});
      }
    });

    document.addEventListener('pointerlockchange', function () {
      state.captured = (document.pointerLockElement === canvas);
    });

    window.addEventListener('mousemove', function (e) {
      if (!state.captured) return;
      var k = TURRET_SENS * inputConfig.sensitivity;
      state.turretYaw = clamp(state.turretYaw - e.movementX * k, -Math.PI, Math.PI);
      var sign = inputConfig.invertY ? -1 : 1;
      state.turretPitch = clamp(state.turretPitch - e.movementY * k * sign, -0.35, 0.35);
    });
  }

  function bindUI() {
    var sideSel = document.getElementById('sideMode');
    var sens = document.getElementById('sens');
    var sensVal = document.getElementById('sensVal');
    var invY = document.getElementById('invertY');

    sideSel.value = state.side;
    sens.value = String(inputConfig.sensitivity);
    sensVal.textContent = inputConfig.sensitivity.toFixed(1);
    invY.checked = inputConfig.invertY;

    sideSel.addEventListener('change', function () {
      state.side = sideSel.value;
      renderReport();
    });
    sens.addEventListener('input', function () {
      inputConfig.sensitivity = parseFloat(sens.value);
      sensVal.textContent = inputConfig.sensitivity.toFixed(1);
      renderReport();
    });
    invY.addEventListener('change', function () {
      inputConfig.invertY = invY.checked;
      renderReport();
    });
  }

/* ------------------------------------------------------------ 报告输出 */

  function renderReport() {
    var st = __selftest();
    var diag = runDiagnostics();
    var lines = [];
    lines.push('=== window.__selftest() 实际返回（JSON 原文）===');
    lines.push(JSON.stringify(st, null, 2));
    lines.push('');
    lines.push('=== 自动诊断 ===');
    lines.push('selftestIdempotent: ' + diag.selftestIdempotent);
    lines.push('buildGeometryPure (两次调用逐元素相等): ' + diag.buildGeometryPure);
    lines.push('positionsUnchangedByRepair: ' + diag.positionsUnchangedByRepair);
    lines.push('triangleVertexMultisetIdentical (修复只改绕序): ' + diag.triangleVertexMultisetIdentical);
    lines.push('inwardFacesBeforeRepair: ' + diag.inwardFacesBeforeRepair);
    lines.push('inwardFacesAfterRepair: ' + diag.inwardFacesAfterRepair);
    lines.push('dynamicBrokenFaces: ' + JSON.stringify(diag.dynamicBrokenFaces));
    lines.push('positions.length: ' + diag.positionsLength + '  indices.length: ' + diag.indicesLength + '  faces: ' + diag.faces);
    document.getElementById('report').textContent = lines.join('\n');

    if (typeof console !== 'undefined' && console.log) {
      console.log('[__selftest]', st);
      console.log('[diagnostics]', diag);
    }
  }

/* --------------------------------------------------------------- 启动 */

  window.buildGeometry = buildGeometry;
  window.__selftest = __selftest;
  window.__diagnostics = runDiagnostics;

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
      buildGeometry: buildGeometry,
      buildRawMesh: buildRawMesh,
      analyzeMesh: analyzeMesh,
      fixWinding: fixWinding,
      runDiagnostics: runDiagnostics,
      INJECT: INJECT
    };
  }

  initRenderer();
  bindInput();
  bindUI();
  renderReport();       // 加载后无条件执行：不需要点击、不需要指针锁、不需要 WebGL
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
