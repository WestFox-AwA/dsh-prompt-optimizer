<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>坦克车体反向面修复 · 单文件自检 (tank-hull-fix.html)</title>
<!--
================================================================================
文件：tank-hull-fix.html
================================================================================
【网格来源】
  按题目要求先在“工作目录”里找坦克车体网格（.obj/.gltf/.glb/.stl/.fbx/.js/.json）。
  本次交付环境里不存在任何可读取的网格资产文件（没有文件系统访问能力），
  因此按题目第 2 条的兜底分支执行：
    → 在文件内程序化生成一个闭合流形的坦克车体（车体长方体 + 炮塔长方体），
      两个封闭壳体的边界边数均为 0，整体边界边数 = 0，三角形数 = 24。
    → 再用固定种子的确定性 LCG 伪随机，把其中约 45% 的三角形故意反向，作为“坏源”。
  这是一个明确的假设，所有修复 / 审计 / 自检都基于它。

【坐标与单位】
  +Z = 车体前方（炮塔朝向 +Z 时正对车头），+Y = 上，+X = 右。
  1 单位 = 1 米。
  车体：x∈[-2,2]，y∈[-1,1]，z∈[-3,3]   → 4m 宽 × 2m 高 × 6m 长
  炮塔：x∈[-1,1]，y∈[1.06,2.4]，z∈[-1.2,1.2]
        与车体顶面留 0.06 的缝，两个壳体互不穿插、各自闭合；
        炮塔绕 Y 轴自转时外接半径 sqrt(1^2+1.2^2)=1.562，
        始终落在车体顶面半宽 2 / 半长 3 之内，全程不穿模。

【判定方法】
  边界边 = 0（闭合）→ 射线奇偶法：
    对每个三角形取形心 C 与单位法线 N，从 C + ε·N（ε = 包围盒对角线 × 0.001）
    沿 N 方向发射射线，统计与全部三角形的交点数；
    奇数 = 射线先进入内部 = 该面朝内；偶数 = 朝外。
  边界边 ≠ 0（非闭合）→ 兜底：整体有向体积 V=(1/6)Σ v0·(v1×v2)（V<0 表示整体绕序反了）
    + 形心法 dot(面法线, 面形心 − 网格形心) > 0 判为朝外。
    局限：形心法对非凸部位不保证可靠。本文件不触发该分支（boundaryEdges = 0）。

【纯计算环境自检配方】
  node -e "const fs=require('fs');const s=fs.readFileSync('tank-hull-fix.html','utf8');const m=s.match(/<script id=\"geometry-core\">([\s\S]*?)<\/script>/);eval(m[1]);console.log(JSON.stringify(globalThis.__selftest()))"

【失效模式核对】
  · 朝向：__selftest().inwardFaces === 0，facesOutwardRatio === 1（离散判定，精确为 1）。
  · 闭合性：__selftest().boundaryEdges === 0，故使用射线奇偶法。
  · 穿插/悬空：两个壳体互不相交；炮塔自转外接半径 1.562 < 车体顶面半宽 2 / 半长 3。
  · 剔除与光照：FrontSide + CULL_FACE(back)，方向光 + 环境光；法线由最终 positions/indices 现算，
    翻面后同步重算，不留旧法线。
  · 渲染与几何一致：渲染缓冲区直接由 buildGeometry().positions / .indices 展开，不另存副本。
  · 边界与异常：空网格返回空几何不崩；索引越界抛错；零面积三角形跳过朝向判定并计数；
    重复 / 非流形边按边出现次数统计并报告。
  · 修复只改绕序：buildGeometry() 内做断言，顶点数、顶点坐标、每个三角形的顶点集合必须不变。
================================================================================
-->

<body>
<canvas id="view"></canvas>

<div id="hud" class="panel">
  <div class="h">坦克车体反向面修复 · 实时自检</div>
  <div id="stats">计算中…</div>
</div>

<div id="controls" class="panel">
  <div class="h">操作提示</div>
  <div><kbd>点击画面</kbd> 进入鼠标捕获，<kbd>Esc</kbd> 或失焦退出（退出后按键立即失效）</div>
  <div>鼠标移动 → 相机绕车体环视</div>
  <div><kbd>W</kbd>/<kbd>S</kbd> 相机前 / 后　<kbd>A</kbd>/<kbd>D</kbd> 相机左 / 右转</div>
  <div><kbd>Q</kbd>/<kbd>E</kbd> 炮塔左 / 右转</div>
  <div><kbd>C</kbd> 切换 FrontSide / DoubleSide 对照　<kbd>1</kbd> 外部视角　<kbd>2</kbd> 内部视角</div>
  <div>灵敏度 <input id="sens" type="range" min="0.1" max="3" step="0.1" value="1.0"><span id="sensval"> 1.0</span></div>

</div>

<div id="clickhint">点击画面进入鼠标捕获（Esc 退出）</div>
<div id="err"></div>

<script id="geometry-core">
(function () {
  'use strict';

  /* ==========================================================================
     控制配置（纯数据；输入脚本与 __selftest() 共用同一份）
     ========================================================================== */
  var CONTROL_CONFIG = {
    move:   { forward: 'KeyW', back: 'KeyS' },
    turn:   { left: 'KeyA', right: 'KeyD' },
    turret: { left: 'KeyQ', right: 'KeyE' },
    exitCapture: 'Escape',
    sensitivity: 1.0,
    invertY: false
  };

  /* 渲染状态（纯数据，由渲染脚本改写，__selftest() 实时读取） */
  var RENDER_STATE = { side: 'FrontSide', cullBackFaces: true };

  /* ==========================================================================
     1) 坏源网格：程序化生成的闭合流形坦克（车体 + 炮塔）
     ========================================================================== */

  function boxMesh(x0, x1, y0, y1, z0, z1) {
    var positions = [
      x0, y0, z0,   x1, y0, z0,   x1, y0, z1,   x0, y0, z1,
      x0, y1, z0,   x1, y1, z0,   x1, y1, z1,   x0, y1, z1
    ];
    // 全部三角形从外部看为逆时针（右手系，法线朝外）
    var indices = [
      0, 1, 2,   0, 2, 3,      // 底面 y0  (法线 -Y)
      4, 6, 5,   4, 7, 6,      // 顶面 y1  (法线 +Y)
      0, 5, 1,   0, 4, 5,      // z0 面    (法线 -Z)
      3, 2, 6,   3, 6, 7,      // z1 面    (法线 +Z)
      0, 3, 7,   0, 7, 4,      // x0 面    (法线 -X)
      1, 6, 2,   1, 5, 6       // x1 面    (法线 +X)
    ];
    return { positions: positions, indices: indices };
  }

  function buildCleanMesh() {
    var parts = [
      boxMesh(-2, 2, -1, 1.00, -3, 3),      // 车体：4m × 2m × 6m
      boxMesh(-1, 1,  1.06, 2.4, -1.2, 1.2) // 炮塔：与车体顶面留 0.06 缝
    ];
    var positions = [];
    var indices = [];
    for (var p = 0; p < parts.length; p++) {
      var part = parts[p];
      var offset = positions.length / 3;
      for (var i = 0; i < part.positions.length; i++) positions.push(part.positions[i]);
      for (var k = 0; k < part.indices.length; k++) indices.push(part.indices[k] + offset);
    }
    return { positions: positions, indices: indices };
  }

  /* 固定种子 LCG，保证坏源完全确定、可复现 */
  function buildBrokenMesh() {
    var clean = buildCleanMesh();
    var idx = clean.indices.slice();
    var triCount = idx.length / 3;
    var seed = 20240517 >>> 0;
    var flips = 0;
    for (var t = 0; t < triCount; t++) {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      var r = seed / 4294967296;
      if (r < 0.45) {
        var i = t * 3;
        var tmp = idx[i]; idx[i] = idx[i + 1]; idx[i + 1] = tmp;
        flips++;
      }
    }
    if (flips === 0) { // 极端保护：至少有一个坏面
      var j = 0;
      var t2 = idx[j]; idx[j] = idx[j + 1]; idx[j + 1] = t2;
    }
    return { positions: clean.positions, indices: idx, flippedAtSource: flips };
  }

  /* ==========================================================================
     2) 几何审计：射线奇偶（闭合）/ 体积 + 形心（非闭合兜底）
     ========================================================================== */

  function dot3(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross3(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }

  /* Möller–Trumbore，返回射线参数 t；无交返回 -Infinity */
  function rayTriangle(ox, oy, oz, dx, dy, dz,
                       ax, ay, az, bx, by, bz, cx, cy, cz) {
    var e1x = bx - ax, e1y = by - ay, e1z = bz - az;
    var e2x = cx - ax, e2y = cy - ay, e2z = cz - az;
    var px = dy * e2z - dz * e2y;
    var py = dz * e2x - dx * e2z;
    var pz = dx * e2y - dy * e2x;
    var det = e1x * px + e1y * py + e1z * pz;
    if (det > -1e-12 && det < 1e-12) return -Infinity;
    var inv = 1.0 / det;
    var tx = ox - ax, ty = oy - ay, tz = oz - az;
    var u = (tx * px + ty * py + tz * pz) * inv;
    if (u < -1e-9 || u > 1 + 1e-9) return -Infinity;
    var qx = ty * e1z - tz * e1y;
    var qy = tz * e1x - tx * e1z;
    var qz = tx * e1y - ty * e1x;
    var v = (dx * qx + dy * qy + dz * qz) * inv;
    if (v < -1e-9 || u + v > 1 + 1e-9) return -Infinity;
    return (e2x * qx + e2y * qy + e2z * qz) * inv;
  }

  function auditMesh(positions, indices) {
    var triCount = (indices.length / 3) | 0;
    var vertexCount = positions.length / 3;
    var i, t, k;

    var faces = [];
    var degenerate = 0;

    for (t = 0; t < triCount; t++) {
      var i0 = indices[3 * t], i1 = indices[3 * t + 1], i2 = indices[3 * t + 2];
      if (i0 < 0 || i1 < 0 || i2 < 0 ||
          i0 >= vertexCount || i1 >= vertexCount || i2 >= vertexCount) {
        throw new Error('索引越界 @ triangle ' + t);
      }
      var p0 = i0 * 3, p1 = i1 * 3, p2 = i2 * 3;
      var ax = positions[p0], ay = positions[p0 + 1], az = positions[p0 + 2];
      var bx = positions[p1], by = positions[p1 + 1], bz = positions[p1 + 2];
      var cx = positions[p2], cy = positions[p2 + 1], cz = positions[p2 + 2];
      var ux = bx - ax, uy = by - ay, uz = bz - az;
      var vx = cx - ax, vy = cy - ay, vz = cz - az;
      var nx = uy * vz - uz * vy;
      var ny = uz * vx - ux * vz;
      var nz = ux * vy - uy * vx;
      var len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      var area = 0.5 * len;
      if (len > 1e-12) { nx /= len; ny /= len; nz /= len; }
      else { nx = 0; ny = 0; nz = 0; degenerate++; }
      faces.push({
        a: [ax, ay, az],
        b: [bx, by, bz],
        c: [cx, cy, cz],
        ctr: [(ax + bx + cx) / 3, (ay + by + cy) / 3, (az + bz + cz) / 3],
        n: [nx, ny, nz],
        area: area
      });
    }

    /* 边界边 / 非流形边统计 */
    var edgeMap = {};
    for (t = 0; t < triCount; t++) {
      var tri = [indices[3 * t], indices[3 * t + 1], indices[3 * t + 2]];
      for (k = 0; k < 3; k++) {
        var ea = tri[k], eb = tri[(k + 1) % 3];
        var key = ea < eb ? (ea + ':' + eb) : (eb + ':' + ea);
        edgeMap[key] = (edgeMap[key] || 0) + 1;
      }
    }
    var boundaryEdges = 0, nonManifoldEdges = 0;
    for (var key2 in edgeMap) {
      if (!Object.prototype.hasOwnProperty.call(edgeMap, key2)) continue;
      var c = edgeMap[key2];
      if (c === 1) boundaryEdges++;
      else if (c > 2) nonManifoldEdges++;
    }

    /* 网格尺度 → ε */
    var minx = Infinity, miny = Infinity, minz = Infinity;
    var maxx = -Infinity, maxy = -Infinity, maxz = -Infinity;
    for (i = 0; i < positions.length; i += 3) {
      var X = positions[i], Y = positions[i + 1], Z = positions[i + 2];
      if (X < minx) minx = X;
      if (X > maxx) maxx = X;
      if (Y < miny) miny = Y;
      if (Y > maxy) maxy = Y;
      if (Z < minz) minz = Z;
      if (Z > maxz) maxz = Z;
    }
    var diag = isFinite(minx)
      ? Math.sqrt((maxx - minx) * (maxx - minx) + (maxy - miny) * (maxy - miny) + (maxz - minz) * (maxz - minz))
      : 1;
    var eps = Math.max(diag * 0.001, 1e-7);

    var inward = new Array(triCount);
    for (i = 0; i < triCount; i++) inward[i] = false;
    var method;

    if (triCount === 0) {
      method = 'empty';
    } else if (boundaryEdges === 0) {
      /* ---- 射线奇偶法 ---- */
      method = 'ray-parity';
      for (i = 0; i < triCount; i++) {
        var f = faces[i];
        if (f.area <= 1e-12) { inward[i] = false; continue; }
        var ox = f.ctr[0] + f.n[0] * eps;
        var oy = f.ctr[1] + f.n[1] * eps;
        var oz = f.ctr[2] + f.n[2] * eps;
        var hits = 0;
        for (var j = 0; j < triCount; j++) {
          if (j === i) continue;
          var g = faces[j];
          if (g.area <= 1e-12) continue;
          var tt = rayTriangle(ox, oy, oz, f.n[0], f.n[1], f.n[2],
                               g.a[0], g.a[1], g.a[2],
                               g.b[0], g.b[1], g.b[2],
                               g.c[0], g.c[1], g.c[2]);
          if (tt > 1e-6) hits++;
        }
        inward[i] = (hits % 2) === 1;
      }
    } else {
      /* ---- 兜底：整体有向体积 + 形心法（对非凸部位不保证可靠） ---- */
      method = 'centroid-fallback';
      var vol = 0, sx = 0, sy = 0, sz = 0;
      for (i = 0; i < triCount; i++) {
        var fi = faces[i];
        vol += dot3(fi.a, cross3(fi.b, fi.c));
        sx += fi.ctr[0]; sy += fi.ctr[1]; sz += fi.ctr[2];
      }
      vol /= 6;
      sx /= triCount; sy /= triCount; sz /= triCount;
      var flipped = vol < 0;
      for (i = 0; i < triCount; i++) {
        var fj = faces[i];
        var d0 = fj.ctr[0] - sx, d1 = fj.ctr[1] - sy, d2 = fj.ctr[2] - sz;
        var outward = (fj.n[0] * d0 + fj.n[1] * d1 + fj.n[2] * d2) > 0;
        if (flipped) outward = !outward;
        inward[i] = !outward;
      }
    }

    var inwardCount = 0;
    for (i = 0; i < triCount; i++) if (inward[i]) inwardCount++;

    return {
      faces: triCount,
      method: method,
      boundaryEdges: boundaryEdges,
      nonManifoldEdges: nonManifoldEdges,
      degenerate: degenerate,
      inward: inward,
      inwardCount: inwardCount,
      outwardCount: triCount - inwardCount,
      epsilon: eps,
      scale: diag
    };
  }

  /* ==========================================================================
     3) 修复：只交换索引三元组内的两个下标
     ========================================================================== */

  function assertSameShape(indicesA, indicesB) {
    if (indicesA.length !== indicesB.length) throw new Error('修复前后索引数量不一致');
    for (var t = 0; t < indicesA.length; t += 3) {
      var a = [indicesA[t], indicesA[t + 1], indicesA[t + 2]].sort(function (x, y) { return x - y; });
      var b = [indicesB[t], indicesB[t + 1], indicesB[t + 2]].sort(function (x, y) { return x - y; });
      if (a[0] !== b[0] || a[1] !== b[1] || a[2] !== b[2]) {
        throw new Error('第 ' + (t / 3) + ' 个三角形的顶点集合被改变，违反“只改绕序”约束');
      }
    }
    return true;
  }

  function fixByWinding(indicesBefore, inwardFlags) {
    var out = indicesBefore.slice();
    var fixed = 0;
    for (var t = 0; t < inwardFlags.length; t++) {
      if (inwardFlags[t]) {
        var i = t * 3;
        var tmp = out[i];
        out[i] = out[i + 1];
        out[i + 1] = tmp;
        fixed++;
      }
    }
    return { indices: out, fixed: fixed };
  }

  /* ==========================================================================
     4) buildGeometry —— 纯函数，返回修复后的几何
     ========================================================================== */

  function buildGeometry() {
    var broken = buildBrokenMesh();
    var positions = broken.positions;          // 扁平数字数组（修复全程不改动）
    var indicesBefore = broken.indices;

    if (indicesBefore.length === 0) {
      return {
        positions: new Float32Array(0),
        indices: new Uint32Array(0),
        faces: 0,
        vertices: positions.length / 3,
        brokenFacesBefore: 0,
        inwardFaces: 0,
        fixedFaces: 0,
        method: 'empty',
        boundaryEdges: 0,
        nonManifoldEdges: 0,
        inwardBefore: [],
        inwardAfter: []
      };
    }

    /* 修复前审计 —— brokenFacesBefore 是真算出来的 */
    var auditBefore = auditMesh(positions, indicesBefore);

    /* 修复 */
    var fixedRes = fixByWinding(indicesBefore, auditBefore.inward);
    var indicesAfter = fixedRes.indices;

    /* 断言：形状未变，只允许三元组内顺序变化 */
    assertSameShape(indicesBefore, indicesAfter);
    if (positions.length !== broken.positions.length) throw new Error('顶点数发生变化');

    /* 修复后审计 */
    var auditAfter = auditMesh(positions, indicesAfter);
    if (auditAfter.inwardCount !== 0) {
      throw new Error('修复后仍存在 ' + auditAfter.inwardCount + ' 个朝内面，修复失败');
    }

    return {
      positions: Float32Array.from(positions),
      indices: Uint32Array.from(indicesAfter),
      /* 诊断字段 */
      faces: auditAfter.faces,
      vertices: positions.length / 3,
      brokenFacesBefore: auditBefore.inwardCount,
      inwardFaces: auditAfter.inwardCount,
      fixedFaces: fixedRes.fixed,
      method: auditBefore.method,
      boundaryEdges: auditBefore.boundaryEdges,
      nonManifoldEdges: auditBefore.nonManifoldEdges,
      degenerate: auditBefore.degenerate,
      epsilon: auditBefore.epsilon,
      scale: auditBefore.scale,
      inwardBefore: auditBefore.inward.slice(),
      inwardAfter: auditAfter.inward.slice()
    };
  }

  /* ==========================================================================
     5) __selftest —— 自检接口
     ========================================================================== */

  function __selftest() {
    var geo = buildGeometry();
    var positions = Array.prototype.slice.call(geo.positions);
    var indices = Array.prototype.slice.call(geo.indices);
    var audit = auditMesh(positions, indices);

    var faces = geo.faces;
    var outward = faces - audit.inwardCount;

    return {
      facesOutwardRatio: faces === 0 ? 0 : outward / faces,
      inwardFaces: audit.inwardCount,
      faces: faces,
      side: RENDER_STATE.side,
      cullBackFaces: RENDER_STATE.cullBackFaces,
      controls: {
        move:   { forward: CONTROL_CONFIG.move.forward,  back: CONTROL_CONFIG.move.back },
        turn:   { left: CONTROL_CONFIG.turn.left,        right: CONTROL_CONFIG.turn.right },
        turret: { left: CONTROL_CONFIG.turret.left,      right: CONTROL_CONFIG.turret.right },
        exitCapture: CONTROL_CONFIG.exitCapture,
        sensitivity: CONTROL_CONFIG.sensitivity,
        invertY: CONTROL_CONFIG.invertY
      },
      /* 反向后额外字段 */
      brokenFacesBefore: geo.brokenFacesBefore,
      fixedFaces: geo.brokenFacesBefore - audit.inwardCount,
      /* 诊断字段 */
      method: audit.method,
      boundaryEdges: audit.boundaryEdges,
      nonManifoldEdges: audit.nonManifoldEdges,
      degenerateFaces: audit.degenerate,
      epsilon: audit.epsilon,
      vertices: geo.vertices,
      perFaceInwardAfter: audit.inward,
      perFaceInwardBefore: geo.inwardBefore
    };
  }

  /* 额外的审计接口（证据用） */
  function __audit(which) {
    var broken = buildBrokenMesh();
    if (which === 'before') {
      return auditMesh(broken.positions, broken.indices);
    }
    var geo = buildGeometry();
    return auditMesh(Array.prototype.slice.call(geo.positions), Array.prototype.slice.call(geo.indices));
  }

  /* ==========================================================================
     6) 全局挂载（带守卫，浏览器与纯计算环境都可用）
     ========================================================================== */
  if (typeof globalThis !== 'undefined') {
    globalThis.buildGeometry = buildGeometry;
    globalThis.__selftest = __selftest;
    globalThis.__audit = __audit;
    globalThis.CONTROL_CONFIG = CONTROL_CONFIG;
    globalThis.__renderState = RENDER_STATE;
  }
})();
</script>

<script id="app">
(function () {
  'use strict';

  var CFG = globalThis.CONTROL_CONFIG;
  var RS = globalThis.__renderState;

  var canvas = document.getElementById('view');
  var errBox = document.getElementById('err');
  var statsBox = document.getElementById('stats');
  var hintBox = document.getElementById('clickhint');

  function showError(msg) {
    errBox.style.display = 'block';
    errBox.textContent = msg;
  }

  var gl = canvas.getContext('webgl', { antialias: true, alpha: false, preserveDrawingBuffer: true });
  if (!gl) {
    showError('当前浏览器不支持 WebGL，无法渲染。几何与自检接口仍然可用（globalThis.__selftest）。');
    return;
  }

  /* ---------------------------------------------------------------- 几何 */
  var geo = globalThis.buildGeometry();          // ← 渲染用的就是这一份
  var P = geo.positions;
  var I = geo.indices;

  var bodyPos = [], bodyNor = [], turretPos = [], turretNor = [];

  (function buildBuffers() {
    for (var t = 0; t < I.length; t += 3) {
      var i0 = I[t] * 3, i1 = I[t + 1] * 3, i2 = I[t + 2] * 3;
      var ax = P[i0], ay = P[i0 + 1], az = P[i0 + 2];
      var bx = P[i1], by = P[i1 + 1], bz = P[i1 + 2];
      var cx = P[i2], cy = P[i2 + 1], cz = P[i2 + 2];

      var nx = (by - ay) * (cz - az) - (bz - az) * (cy - ay);
      var ny = (bz - az) * (cx - ax) - (bx - ax) * (cz - az);
      var nz = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
      var l = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      nx /= l; ny /= l; nz /= l;

      // 车体 / 炮塔分组：三角形三个顶点的 y 全部 > 1.0 即属于炮塔
      var isTurret = (ay > 1.0 && by > 1.0 && cy > 1.0);
      var tp = isTurret ? turretPos : bodyPos;
      var tn = isTurret ? turretNor : bodyNor;

      tp.push(ax, ay, az, bx, by, bz, cx, cy, cz);
      tn.push(nx, ny, nz, nx, ny, nz, nx, ny, nz);
    }
  })();

  function makeBuffer(arr) {
    var b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW);
    return b;
  }
  var bodyPosBuf = makeBuffer(bodyPos), bodyNorBuf = makeBuffer(bodyNor);
  var turretPosBuf = makeBuffer(turretPos), turretNorBuf = makeBuffer(turretNor);
  var bodyVertCount = bodyPos.length / 3;
  var turretVertCount = turretPos.length / 3;

  /* ------------------------------------------------------------- shaders */
  var VS = [
    'attribute vec3 aPos;',
    'attribute vec3 aNormal;',
    'uniform mat4 uProj;',
    'uniform mat4 uView;',
    'uniform mat3 uRot;',
    'varying vec3 vNormal;',
    'void main(){',
    '  vec3 p = uRot * aPos;',
    '  vNormal = uRot * aNormal;',
    '  gl_Position = uProj * uView * vec4(p, 1.0);',
    '}'
  ].join('\n');

  var FS = [
    'precision mediump float;',
    'varying vec3 vNormal;',
    'uniform vec3 uLightDir;',
    'uniform vec3 uColor;',
    'void main(){',
    '  vec3 n = normalize(vNormal);',
    '  vec3 l = normalize(uLightDir);',
    '  float d = max(dot(n, l), 0.0);',
    '  vec3 c = uColor * (0.30 + 0.70 * d);',
    '  gl_FragColor = vec4(c, 1.0);',
    '}'
  ].join('\n');

  function compileShader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error('Shader 编译失败: ' + gl.getShaderInfoLog(s));
    }
    return s;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error('Program 链接失败: ' + gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  var aPos = gl.getAttribLocation(prog, 'aPos');
  var aNormal = gl.getAttribLocation(prog, 'aNormal');
  var uProj = gl.getUniformLocation(prog, 'uProj');
  var uView = gl.getUniformLocation(prog, 'uView');
  var uRot = gl.getUniformLocation(prog, 'uRot');
  var uLightDir = gl.getUniformLocation(prog, 'uLightDir');
  var uColor = gl.getUniformLocation(prog, 'uColor');

  gl.enableVertexAttribArray(aPos);
  gl.enableVertexAttribArray(aNormal);

  /* -------------------------------------------------------------- 相机 */
  var cam = { target: [0, 0.5, 0], yaw: 0.7, pitch: 0.35, dist: 11.0 };
  var turretAngle = 0;

  var IDENTITY3 = new Float32Array([1, 0, 0, 0, 1, 0, 0, 0, 1]);
  function rotYMat3(a) {
    var c = Math.cos(a), s = Math.sin(a);
    // 列主序：[c,0,-s, 0,1,0, s,0,c]
    return new Float32Array([c, 0, -s, 0, 1, 0, s, 0, c]);
  }

  function perspective(fovy, aspect, near, far) {
    var f = 1 / Math.tan(fovy / 2);
    var nf = 1 / (near - far);
    return new Float32Array([
      f / aspect, 0, 0, 0,
      0, f, 0, 0,
      0, 0, (far + near) * nf, -1,
      0, 0, 2 * far * near * nf, 0
    ]);
  }

  function lookAt(eye, center, up) {
    var zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
    var zl = Math.sqrt(zx * zx + zy * zy + zz * zz) || 1;
    zx /= zl; zy /= zl; zz /= zl;

    var xx = up[1] * zz - up[2] * zy;
    var xy = up[2] * zx - up[0] * zz;
    var xz = up[0] * zy - up[1] * zx;
    var xl = Math.sqrt(xx * xx + xy * xy + xz * xz) || 1;
    xx /= xl; xy /= xl; xz /= xl;

    var yx = zy * xz - zz * xy;
    var yy = zz * xx - zx * xz;
    var yz = zx * xy - zy * xx;

    return new Float32Array([
      xx, yx, zx, 0,
      xy, yy, zy, 0,
      xz, yz, zz, 0,
      -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
      -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
      -(zx * eye[0] + zy * eye[1] + zz * eye[2]),
      1
    ]);
  }

  function currentEye() {
    var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    return [
      cam.target[0] + cam.dist * cp * Math.sin(cam.yaw),
      cam.target[1] + cam.dist * sp,
      cam.target[2] + cam.dist * cp * Math.cos(cam.yaw)
    ];
  }

  /* ------------------------------------------------------------- 输入 */
  var keysHeld = new Set();
  var pointerSupported = (typeof canvas.requestPointerLock === 'function');
  var POINTER_NOT_USED = !pointerSupported;

  function isCaptured() {
    return POINTER_NOT_USED || document.pointerLockElement === canvas;
  }

  canvas.addEventListener('click', function () {
    if (POINTER_NOT_USED) return;
    if (document.pointerLockElement !== canvas) {
      var p = canvas.requestPointerLock();
      if (p && typeof p.catch === 'function') p.catch(function () {});
    }
  });

  document.addEventListener('pointerlockchange', function () {
    var locked = (document.pointerLockElement === canvas);
    keysHeld.clear();                       // 退出捕获后按键不得继续生效
    hintBox.classList.toggle('hidden', locked || POINTER_NOT_USED);
    refreshStats();
  });

  document.addEventListener('pointerlockerror', function () {
    hintBox.classList.remove('hidden');
  });

  window.addEventListener('blur', function () {
    keysHeld.clear();                       // 失焦不漂移
  });

  document.addEventListener('mousemove', function (e) {
    if (!isCaptured()) return;
    var s = CFG.sensitivity * 0.0025;
    cam.yaw -= e.movementX * s;
    var dy = e.movementY * s * (CFG.invertY ? -1 : 1);
    cam.pitch -= dy;
    clampPitch();
  });

  function clampPitch() {
    var lim = 1.45;
    if (cam.pitch > lim) cam.pitch = lim;
    if (cam.pitch < -lim) cam.pitch = -lim;
  }

  document.addEventListener('keydown', function (e) {
    // 视图类快捷键（一次触发，不产生持续运动，任何时刻都允许）
    if (e.code === 'KeyC' && !e.repeat) {
      setSide(RS.side === 'FrontSide' ? 'DoubleSide' : 'FrontSide');
      e.preventDefault();
      return;
    }
    if (e.code === 'Digit1' && !e.repeat) { setPreset('outside'); e.preventDefault(); return; }
    if (e.code === 'Digit2' && !e.repeat) { setPreset('inside');  e.preventDefault(); return; }

    if (!isCaptured()) return;
    if (e.code === CFG.exitCapture) return;   // Esc 由浏览器处理，退出捕获
    keysHeld.add(e.code);
    if (e.code === 'KeyW' || e.code === 'KeyS' || e.code === 'KeyA' ||
        e.code === 'KeyD' || e.code === 'KeyQ' || e.code === 'KeyE') {
      e.preventDefault();
    }
  });

  document.addEventListener('keyup', function (e) {
    keysHeld.delete(e.code);
  });

  function setSide(s) {
    RS.side = s;
    RS.cullBackFaces = (s === 'FrontSide');
    refreshStats();
  }

  function setPreset(which) {
    if (which === 'outside') {
      cam.target = [0, 0.5, 0];
      cam.yaw = 0.7;
      cam.pitch = 0.35;
      cam.dist = 11.0;
    } else {
      // 相机置于车体内部：eye = (0,-0.3,0)，朝 +Z 看
      cam.target = [0, -0.3, 1.8];
      cam.yaw = Math.PI;
      cam.pitch = 0;
      cam.dist = 1.8;
    }
    refreshStats();
  }

  /* UI：灵敏度 / 反转 Y —— 直接改同一份 CONTROL_CONFIG */
  var sensEl = document.getElementById('sens');
  var sensValEl = document.getElementById('sensval');
  var invyEl = document.getElementById('invy');

  sensEl.value = String(CFG.sensitivity);
  sensValEl.textContent = ' ' + CFG.sensitivity.toFixed(1);
  invyEl.checked = !!CFG.invertY;

  sensEl.addEventListener('input', function () {
    CFG.sensitivity = parseFloat(sensEl.value);
    sensValEl.textContent = ' ' + CFG.sensitivity.toFixed(1);
    refreshStats();
  });
  invyEl.addEventListener('change', function () {
    CFG.invertY = !!invyEl.checked;
    refreshStats();
  });

  /* -------------------------------------------------------------- 更新 */
  function update(dt) {
    if (!isCaptured()) return;
    var zoomSpeed = 9.0;
    var rotSpeed = 1.4;

    if (keysHeld.has(CFG.move.forward)) cam.dist = Math.max(2.0, cam.dist - zoomSpeed * dt);
    if (keysHeld.has(CFG.move.back))    cam.dist = Math.min(45.0, cam.dist + zoomSpeed * dt);
    if (keysHeld.has(CFG.turn.left))    cam.yaw += rotSpeed * dt;
    if (keysHeld.has(CFG.turn.right))   cam.yaw -= rotSpeed * dt;
    if (keysHeld.has(CFG.turret.left))  turretAngle += rotSpeed * dt;
    if (keysHeld.has(CFG.turret.right)) turretAngle -= rotSpeed * dt;
  }

  /* -------------------------------------------------------------- 渲染 */
  function resizeCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    var h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  }

  function render() {
    resizeCanvas();
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0.07, 0.09, 0.13, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);

    if (RS.cullBackFaces) {
      gl.enable(gl.CULL_FACE);
      gl.cullFace(gl.BACK);          // 逆时针为正面
    } else {
      gl.disable(gl.CULL_FACE);
    }

    var eye = currentEye();
    var proj = perspective(50 * Math.PI / 180, canvas.width / canvas.height, 0.1, 300);
    var view = lookAt(eye, cam.target, [0, 1, 0]);

    gl.useProgram(prog);
    gl.uniformMatrix4fv(uProj, false, proj);
    gl.uniformMatrix4fv(uView, false, view);
    gl.uniform3f(uLightDir, 0.42, 0.82, 0.38);
    gl.uniform3f(uColor, 0.55, 0.68, 0.42);

    /* 车体 */
    gl.bindBuffer(gl.ARRAY_BUFFER, bodyPosBuf);
    gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, bodyNorBuf);
    gl.vertexAttribPointer(aNormal, 3, gl.FLOAT, false, 0, 0);
    gl.uniformMatrix3fv(uRot, false, IDENTITY3);
    gl.drawArrays(gl.TRIANGLES, 0, bodyVertCount);

    /* 炮塔（绕 Y 轴自转） */
    gl.bindBuffer(gl.ARRAY_BUFFER, turretPosBuf);
    gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, turretNorBuf);
    gl.vertexAttribPointer(aNormal, 3, gl.FLOAT, false, 0, 0);
    gl.uniformMatrix3fv(uRot, false, rotYMat3(turretAngle));
    gl.drawArrays(gl.TRIANGLES, 0, turretVertCount);
  }

  /* ------------------------------------------------------------- 状态栏 */
  var statsCache = null;

  function refreshStats() {
    try {
      var st = globalThis.__selftest();
      statsCache = st;
      var inwardOk = (st.inwardFaces === 0);
      var ratioOk = (st.facesOutwardRatio === 1);
      statsBox.innerHTML =
        '<div>源网格朝内面 <b>brokenFacesBefore</b> = <b>' + st.brokenFacesBefore + '</b>' +
        '　修复 <b>fixedFaces</b> = <b class="ok">' + st.fixedFaces + '</b>' +
        '　修复后朝内面 <b>inwardFaces</b> = <b class="' + (inwardOk ? 'ok' : 'bad') + '">' + st.inwardFaces + '</b></div>' +
        '<div>总面数 <b>faces</b> = ' + st.faces + '　顶点数 ' + st.vertices + '</div>' +
        '<div>朝外比例 <b>facesOutwardRatio</b> = <b class="' + (ratioOk ? 'ok' : 'bad') + '">' + st.facesOutwardRatio + '</b></div>' +
        '<div>判定方法 <b>method</b> = ' + st.method + '　边界边 = ' + st.boundaryEdges +
        '　非流形边 = ' + st.nonManifoldEdges + '　退化面 = ' + st.degenerateFaces + '</div>' +
        '<div>ε = ' + st.epsilon.toFixed(5) + '　网格尺度 = ' + (st.scale || 0).toFixed(3) + '</div>' +
        '<div>渲染 <b>side</b> = <b>' + st.side + '</b>　<b>cullBackFaces</b> = <b>' + st.cullBackFaces + '</b></div>' +
        '<div class="dim">键位：' + st.controls.move.forward + '/' + st.controls.move.back + ' 前后 · ' +
        st.controls.turn.left + '/' + st.controls.turn.right + ' 转向 · ' +
        st.controls.turret.left + '/' + st.controls.turret.right + ' 炮塔 · ' +
        st.controls.exitCapture + ' 退出捕获 · 灵敏度 ' + st.controls.sensitivity.toFixed(1) +
        ' · 反转Y ' + st.controls.invertY + '</div>' +
        '<div class="dim">捕获状态：' + (document.pointerLockElement === canvas ? '已捕获' : '未捕获') + '</div>';
    } catch (err) {
      statsBox.textContent = '自检失败：' + err.message;
    }
  }

  /* ---------------------------------------------------------------- 主循环 */
  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.__setSide = setSide;
  window.__setPreset = setPreset;

  refreshStats();
  setPreset('outside');
  hintBox.classList.toggle('hidden', POINTER_NOT_USED);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
