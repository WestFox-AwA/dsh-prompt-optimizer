<script>
/* ==========================================================================
 * PORTABLE-BEGIN
 * 可独立移植段：不依赖 THREE / DOM / window / 闭包外变量，无递归爆栈。
 * 坐标约定：X = 车体右侧，Y = 上，Z = 车头方向（前方）。
 * 单位约定：1 单位 = 1 米。车体占位：x∈[-1.70,1.70]，y∈[0,2.55]，z∈[-3.20,3.30]。
 * 网格由两个互不穿插的闭合实体分量组成：
 *   分量 0 = 车体棱柱（凹多边形轮廓 A0 沿 Y 挤出，y∈[0.00,1.75]）
 *   分量 1 = 炮塔棱柱（"圆 + 炮管"钥匙孔轮廓 A1 沿 Y 挤出，y∈[1.75,2.55]）
 * 炮塔底面与车体顶面在 y=1.75 相切（接触，不穿插）。
 * ========================================================================== */

var BG_Y0 = 0.00;   // 车体底面
var BG_Y1 = 1.75;   // 车体顶面 == 炮塔底面
var BG_Y2 = 2.55;   // 炮塔顶面

/* 车体俯视轮廓 (x,z)，逆时针（车头朝 +Z）。前部中央有一个 U 形凹口：
 * 该凹口使形体非星形，"重心点积"判据在此不可靠，故只作第三方对照。 */
var BG_BODY_PROFILE = [
  [-1.70, -3.20],
  [ 1.70, -3.20],
  [ 1.70,  2.10],
  [ 1.05,  3.30],
  [ 0.45,  3.30],
  [ 0.45,  1.90],
  [-0.45,  1.90],
  [-0.45,  3.30],
  [-1.05,  3.30],
  [-1.70,  2.10]
];

var BG_TURRET_CTR_Z = -1.50;   // 炮塔中心 z
var BG_TURRET_R     =  1.00;   // 炮塔半径
var BG_TURRET_SEG   =  32;     // 圆近似分段
var BG_BARREL_HALF  =  0.11;   // 炮管半宽
var BG_BARREL_END_Z =  1.40;   // 炮管前端 z

/* ------------------------------------------------------------------ */
/* 确定性伪随机（用于植入反向面，保证 buildGeometry 是纯函数）          */
function bgMulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ------------------------------------------------------------------ */
/* 2D 多边形工具                                                        */
function bgPolyArea(poly) {
  var s = 0;
  for (var i = 0; i < poly.length; i++) {
    var p = poly[i], q = poly[(i + 1) % poly.length];
    s += p[0] * q[1] - q[0] * p[1];
  }
  return s * 0.5;
}

function bgPointStrictInTri(px, py, ax, ay, bx, by, cx, cy, sign) {
  var d1 = (bx - ax) * (py - ay) - (by - ay) * (px - ax);
  var d2 = (cx - bx) * (py - by) - (cy - by) * (px - bx);
  var d3 = (ax - cx) * (py - cy) - (ay - cy) * (px - cx);
  var eps = 1e-10;
  if (sign > 0) return d1 > eps && d2 > eps && d3 > eps;
  return d1 < -eps && d2 < -eps && d3 < -eps;
}

/* 耳切三角化：输出三角形的方向与输入多边形方向一致 */
function bgTriangulate2D(poly) {
  var n = poly.length;
  if (n < 3) return [];
  var sign = bgPolyArea(poly) > 0 ? 1 : -1;
  var idx = [], i;
  for (i = 0; i < n; i++) idx.push(i);
  var out = [];
  var guard = 0, limit = n * n * 4 + 64;
  while (idx.length > 3 && guard++ < limit) {
    var cut = false;
    for (i = 0; i < idx.length; i++) {
      var m = idx.length;
      var i0 = idx[(i + m - 1) % m], i1 = idx[i], i2 = idx[(i + 1) % m];
      var a = poly[i0], b = poly[i1], c = poly[i2];
      var cross = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
      if (sign * cross <= 1e-12) continue;
      var ok = true;
      for (var j = 0; j < idx.length; j++) {
        var k = idx[j];
        if (k === i0 || k === i1 || k === i2) continue;
        if (bgPointStrictInTri(poly[k][0], poly[k][1], a[0], a[1], b[0], b[1], c[0], c[1], sign)) {
          ok = false; break;
        }
      }
      if (!ok) continue;
      out.push([i0, i1, i2]);
      idx.splice(i, 1);
      cut = true;
      break;
    }
    if (!cut) break;
  }
  if (idx.length === 3) out.push([idx[0], idx[1], idx[2]]);
  return out;
}

/* ------------------------------------------------------------------ */
/* 炮塔俯视轮廓 (x,z)：圆 + 前伸炮管（钥匙孔），逆时针                   */
function bgTurretProfile() {
  var N = BG_TURRET_SEG, R = BG_TURRET_R, zc = BG_TURRET_CTR_Z;
  var w = BG_BARREL_HALF;
  var th0 = Math.asin(Math.min(0.999, w / R));
  var pts = [];
  pts.push([-R * Math.sin(th0), zc + R * Math.cos(th0)]);
  for (var i = 1; i < N; i++) {
    var th = i * 2 * Math.PI / N;
    if (th <= th0) continue;
    if (th >= 2 * Math.PI - th0) continue;
    pts.push([-R * Math.sin(th), zc + R * Math.cos(th)]);
  }
  pts.push([R * Math.sin(th0), zc + R * Math.cos(th0)]);
  pts.push([ w, BG_BARREL_END_Z]);
  pts.push([-w, BG_BARREL_END_Z]);
  return pts;
}

/* ------------------------------------------------------------------ */
/* 坦克网格构造（未植入破面的干净版本）                                 */
function bgBuildTankMesh() {
  var verts = [];
  var vmap = Object.create(null);
  function V(x, y, z) {
    var k = x + ',' + y + ',' + z;
    var i = vmap[k];
    if (i === undefined) { i = verts.length; verts.push([x, y, z]); vmap[k] = i; }
    return i;
  }
  var idx = [], i, t;

  /* ---- 分量 0：车体棱柱 ---- */
  var A0 = BG_BODY_PROFILE;
  var nA = A0.length;
  var triA = bgTriangulate2D(A0);            /* (x,z) CCW */
  for (i = 0; i < triA.length; i++) {        /* 底面：CCW → 3D 法线 -Y */
    t = triA[i];
    idx.push(V(A0[t[0]][0], BG_Y0, A0[t[0]][1]),
             V(A0[t[1]][0], BG_Y0, A0[t[1]][1]),
             V(A0[t[2]][0], BG_Y0, A0[t[2]][1]));
  }
  for (i = 0; i < triA.length; i++) {        /* 顶面：翻转为 CW → 3D 法线 +Y */
    t = triA[i];
    idx.push(V(A0[t[0]][0], BG_Y1, A0[t[0]][1]),
             V(A0[t[2]][0], BG_Y1, A0[t[2]][1]),
             V(A0[t[1]][0], BG_Y1, A0[t[1]][1]));
  }
  for (i = 0; i < nA; i++) {                 /* 侧面 */
    var a = A0[i], b = A0[(i + 1) % nA];
    var b0 = V(a[0], BG_Y0, a[1]), t0 = V(a[0], BG_Y1, a[1]);
    var b1 = V(b[0], BG_Y0, b[1]), t1 = V(b[0], BG_Y1, b[1]);
    idx.push(b0, t0, t1);
    idx.push(b0, t1, b1);
  }
  var bodyTriCount = idx.length / 3;

  /* ---- 分量 1：炮塔棱柱 ---- */
  var A1 = bgTurretProfile();
  if (bgPolyArea(A1) < 0) A1 = A1.slice().reverse();
  var nB = A1.length;
  var triB = bgTriangulate2D(A1);
  for (i = 0; i < triB.length; i++) {
    t = triB[i];
    idx.push(V(A1[t[0]][0], BG_Y1, A1[t[0]][1]),
             V(A1[t[1]][0], BG_Y1, A1[t[1]][1]),
             V(A1[t[2]][0], BG_Y1, A1[t[2]][1]));
  }
  for (i = 0; i < triB.length; i++) {
    t = triB[i];
    idx.push(V(A1[t[0]][0], BG_Y2, A1[t[0]][1]),
             V(A1[t[2]][0], BG_Y2, A1[t[2]][1]),
             V(A1[t[1]][0], BG_Y2, A1[t[1]][1]));
  }
  for (i = 0; i < nB; i++) {
    var a2 = A1[i], b2 = A1[(i + 1) % nB];
    var p0 = V(a2[0], BG_Y1, a2[1]), q0 = V(a2[0], BG_Y2, a2[1]);
    var p1 = V(b2[0], BG_Y1, b2[1]), q1 = V(b2[0], BG_Y2, b2[1]);
    idx.push(p0, q0, q1);
    idx.push(p0, q1, p1);
  }

  return {
    positions: verts,
    indices: idx,
    bodyTriCount: bodyTriCount,
    turretTriCount: idx.length / 3 - bodyTriCount
  };
}

/* ------------------------------------------------------------------ */
/* 植入绕序反向面（确定性）                                            */
function bgInjectBrokenFaces(g, ratio, seed) {
  var F = g.indices.length / 3;
  var rnd = bgMulberry32(seed === undefined ? 0x5EED1234 : seed);
  var K = Math.max(1, Math.round(F * (ratio === undefined ? 0.08 : ratio)));
  var chosen = Object.create(null);
  var picked = [];
  while (picked.length < K) {
    var f = Math.floor(rnd() * F) % F;
    if (chosen[f]) continue;
    chosen[f] = 1;
    picked.push(f);
  }
  picked.sort(function (x, y) { return x - y; });
  for (var i = 0; i < picked.length; i++) {
    var f2 = picked[i];
    var tmp = g.indices[3 * f2 + 1];
    g.indices[3 * f2 + 1] = g.indices[3 * f2 + 2];
    g.indices[3 * f2 + 2] = tmp;
  }
  g.injectedFaces = picked;
  return g;
}

/* ------------------------------------------------------------------ */
/* 边表 / 连通分量                                                      */
function bgEdgeKey(u, v) { return u < v ? u * 4096 + v : v * 4096 + u; }

function bgBuildEdgeMap(indices) {
  var map = new Map();
  var F = indices.length / 3;
  for (var f = 0; f < F; f++) {
    var a = indices[3 * f], b = indices[3 * f + 1], c = indices[3 * f + 2];
    bgPushEdge(map, a, b, f);
    bgPushEdge(map, b, c, f);
    bgPushEdge(map, c, a, f);
  }
  return map;
}
function bgPushEdge(map, u, v, f) {
  var key = bgEdgeKey(u, v);
  var dir = u < v ? 1 : -1;
  var arr = map.get(key);
  if (!arr) { arr = []; map.set(key, arr); }
  arr.push(f, dir);
}

function bgFindComponents(indices) {
  var F = indices.length / 3;
  var emap = bgBuildEdgeMap(indices);
  var seen = new Uint8Array(F);
  var comps = [];
  var stack = [];
  for (var s = 0; s < F; s++) {
    if (seen[s]) continue;
    var comp = [];
    stack.length = 0; stack.push(s); seen[s] = 1;
    while (stack.length) {
      var f = stack.pop();
      comp.push(f);
      for (var k = 0; k < 3; k++) {
        var u = indices[3 * f + k], v = indices[3 * f + ((k + 1) % 3)];
        var rec = emap.get(bgEdgeKey(u, v));
        if (!rec || rec.length !== 4) continue;
        var g = (rec[0] === f) ? rec[2] : rec[0];
        if (!seen[g]) { seen[g] = 1; stack.push(g); }
      }
    }
    comp.sort(function (x, y) { return x - y; });
    comps.push(comp);
  }
  return comps;
}

/* 每条内部边是否被恰好两个三角形反向遍历 */
function bgEdgeConflicts(indices) {
  var emap = bgBuildEdgeMap(indices);
  var bad = 0, nonManifold = 0, openEdges = 0;
  emap.forEach(function (rec) {
    if (rec.length === 2) { openEdges++; return; }
    if (rec.length !== 4) { nonManifold++; return; }
    if (rec[1] === rec[3]) bad++;
  });
  return { conflicts: bad, nonManifold: nonManifold, openEdges: openEdges };
}

/* 有符号体积 V = (1/6)·Σ v0·(v1×v2)，绕序由 flip 修正 */
function bgSignedVolume(P, I, faceList, flip) {
  var V = 0;
  for (var i = 0; i < faceList.length; i++) {
    var f = faceList[i];
    var ia = I[3 * f], ib = I[3 * f + 1], ic = I[3 * f + 2];
    if (flip && flip[f]) { var t = ib; ib = ic; ic = t; }
    var A = P[ia], B = P[ib], C = P[ic];
    V += A[0] * (B[1] * C[2] - B[2] * C[1])
       + A[1] * (B[2] * C[0] - B[0] * C[2])
       + A[2] * (B[0] * C[1] - B[1] * C[0]);
  }
  return V / 6;
}

/* ------------------------------------------------------------------ */
/* 核心修复：拓扑一致性(BFS) + 全局/分量有符号体积                        */
function bgFixWinding(positions, indices) {
  var P = positions, I = indices;
  var F = I.length / 3;
  var emap = bgBuildEdgeMap(I);
  var flip = new Uint8Array(F);
  var visited = new Uint8Array(F);
  var comps = [];
  var queue = new Int32Array(F);
  var conflicts = 0;
  var s, f, k;

  for (s = 0; s < F; s++) {
    if (visited[s]) continue;
    var head = 0, tail = 0;
    queue[tail++] = s; visited[s] = 1;
    var comp = [];
    while (head < tail) {
      f = queue[head++];
      comp.push(f);
      for (k = 0; k < 3; k++) {
        var u = I[3 * f + k], v = I[3 * f + ((k + 1) % 3)];
        var rec = emap.get(bgEdgeKey(u, v));
        if (!rec || rec.length !== 4) continue;
        var f0 = rec[0], d0 = rec[1], f1 = rec[2], d1 = rec[3];
        var g, dMe, dOther;
        if (f0 === f) { g = f1; dMe = d0; dOther = d1; }
        else if (f1 === f) { g = f0; dMe = d1; dOther = d0; }
        else continue;
        var want = (dMe === dOther) ? (flip[f] ^ 1) : flip[f];
        if (!visited[g]) {
          visited[g] = 1;
          flip[g] = want;
          queue[tail++] = g;
        } else if (flip[g] !== want) {
          conflicts++;
        }
      }
    }
    comp.sort(function (x, y) { return x - y; });
    comps.push(comp);
  }

  /* 主判据二：每个闭合分量的有符号体积，负则整体翻转该分量 */
  var compVolBefore = [], compVolAfter = [];
  for (var ci = 0; ci < comps.length; ci++) {
    var v0 = bgSignedVolume(P, I, comps[ci], flip);
    compVolBefore.push(v0);
    if (v0 < 0) {
      for (var i2 = 0; i2 < comps[ci].length; i2++) flip[comps[ci][i2]] ^= 1;
    }
    compVolAfter.push(bgSignedVolume(P, I, comps[ci], flip));
  }

  /* 主判据二（全局）：Σ 全体面，V<0 表示整体朝内 → 整体翻转 */
  var allFaces = [];
  for (s = 0; s < F; s++) allFaces.push(s);
  var totalBefore = bgSignedVolume(P, I, allFaces, flip);
  var globalFlipped = false;
  if (totalBefore < 0) {
    globalFlipped = true;
    for (s = 0; s < F; s++) flip[s] ^= 1;
  }
  var totalAfter = bgSignedVolume(P, I, allFaces, flip);

  /* 应用：只改动索引顺序，不触碰任何顶点坐标 */
  var out = new Array(I.length);
  var flippedFaces = [];
  for (f = 0; f < F; f++) {
    var a = I[3 * f], b = I[3 * f + 1], c = I[3 * f + 2];
    if (flip[f]) {
      out[3 * f] = a; out[3 * f + 1] = c; out[3 * f + 2] = b;
      flippedFaces.push(f);
    } else {
      out[3 * f] = a; out[3 * f + 1] = b; out[3 * f + 2] = c;
    }
  }

  return {
    indices: out,
    flippedFaces: flippedFaces,
    flipCount: flippedFaces.length,
    components: comps,
    topologicalConflicts: conflicts,
    componentVolumesBefore: compVolBefore,
    componentVolumesAfter: compVolAfter,
    globalVolumeBefore: totalBefore,
    globalVolumeAfter: totalAfter,
    globalFlipped: globalFlipped
  };
}

/* ------------------------------------------------------------------ */
/* 几何辅助                                                             */
function bgFaceNormal(a, b, c) {
  var ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
  var vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
  var nx = uy * vz - uz * vy;
  var ny = uz * vx - ux * vz;
  var nz = ux * vy - uy * vx;
  var L = Math.sqrt(nx * nx + ny * ny + nz * nz);
  if (L < 1e-15) return [0, 0, 0];
  return [nx / L, ny / L, nz / L];
}

function bgRayTriangle(ox, oy, oz, dx, dy, dz, a, b, c) {
  var e1x = b[0] - a[0], e1y = b[1] - a[1], e1z = b[2] - a[2];
  var e2x = c[0] - a[0], e2y = c[1] - a[1], e2z = c[2] - a[2];
  var px = dy * e2z - dz * e2y;
  var py = dz * e2x - dx * e2z;
  var pz = dx * e2y - dy * e2x;
  var det = e1x * px + e1y * py + e1z * pz;
  if (det > -1e-12 && det < 1e-12) return -1;
  var inv = 1 / det;
  var tx = ox - a[0], ty = oy - a[1], tz = oz - a[2];
  var u = (tx * px + ty * py + tz * pz) * inv;
  if (u < -1e-9 || u > 1 + 1e-9) return -1;
  var qx = ty * e1z - tz * e1y;
  var qy = tz * e1x - tx * e1z;
  var qz = tx * e1y - ty * e1x;
  var v = (dx * qx + dy * qy + dz * qz) * inv;
  if (v < -1e-9 || u + v > 1 + 1e-9) return -1;
  return (e2x * qx + e2y * qy + e2z * qz) * inv;
}

/* 逐面奇偶规则。多实体接触情形下按"连通分量"独立求交（等价于把每个
 * 闭合分量视为一个实心体），同时对全网格也跑一遍作为交叉对照。 */
function bgInwardMask(P, I, comps, perComponent) {
  var F = I.length / 3;
  var inward = new Uint8Array(F);
  var pert = [[1e-5, 2.3e-5, -3.1e-5], [-2.7e-5, 1e-5, 3.3e-5], [3.5e-5, -1.3e-5, 1.1e-5]];
  var groups = perComponent === false ? [null] : comps;

  for (var gi = 0; gi < groups.length; gi++) {
    var group = groups[gi];
    var list = group ? group : (function () {
      var a = []; for (var q = 0; q < F; q++) a.push(q); return a;
    })();
    var M = list.length;
    var TA = new Array(M), TB = new Array(M), TC = new Array(M);
    var i;
    for (i = 0; i < M; i++) {
      var f0 = list[i];
      TA[i] = P[I[3 * f0]];
      TB[i] = P[I[3 * f0 + 1]];
      TC[i] = P[I[3 * f0 + 2]];
    }
    for (i = 0; i < M; i++) {
      var f = list[i];
      if (group === null && inward[f] && perComponent === false) { /* 覆盖式重算 */ }
      var a = TA[i], b = TB[i], c = TC[i];
      var n = bgFaceNormal(a, b, c);
      if (n[0] === 0 && n[1] === 0 && n[2] === 0) { inward[f] = 1; continue; }
      var ox = (a[0] + b[0] + c[0]) / 3;
      var oy = (a[1] + b[1] + c[1]) / 3;
      var oz = (a[2] + b[2] + c[2]) / 3;
      var votes = 0;
      for (var kk = 0; kk < 3; kk++) {
        var dx = n[0] + pert[kk][0], dy = n[1] + pert[kk][1], dz = n[2] + pert[kk][2];
        var L = Math.sqrt(dx * dx + dy * dy + dz * dz);
        dx /= L; dy /= L; dz /= L;
        var cnt = 0;
        for (var j = 0; j < M; j++) {
          if (j === i) continue;
          if (bgRayTriangle(ox, oy, oz, dx, dy, dz, TA[j], TB[j], TC[j]) > 1e-7) cnt++;
        }
        if ((cnt & 1) === 1) votes++;
      }
      inward[f] = votes >= 2 ? 1 : 0;
    }
  }
  return inward;
}

/* 第三方对照判据：重心点积（仅作参考，不作为主判据） */
function bgCentroidDotMask(P, I, comps) {
  var F = I.length / 3;
  var out = new Uint8Array(F);
  for (var c = 0; c < comps.length; c++) {
    var comp = comps[c];
    var cx = 0, cy = 0, cz = 0, n = 0, i, f;
    for (i = 0; i < comp.length; i++) {
      f = comp[i];
      for (var v = 0; v < 3; v++) {
        var p = P[I[3 * f + v]];
        cx += p[0]; cy += p[1]; cz += p[2]; n++;
      }
    }
    cx /= n; cy /= n; cz /= n;
    for (i = 0; i < comp.length; i++) {
      f = comp[i];
      var a = P[I[3 * f]], b = P[I[3 * f + 1]], d = P[I[3 * f + 2]];
      var nor = bgFaceNormal(a, b, d);
      var mx = (a[0] + b[0] + d[0]) / 3 - cx;
      var my = (a[1] + b[1] + d[1]) / 3 - cy;
      var mz = (a[2] + b[2] + d[2]) / 3 - cz;
      out[f] = (nor[0] * mx + nor[1] * my + nor[2] * mz) < 0 ? 1 : 0;
    }
  }
  return out;
}

/* ------------------------------------------------------------------ */
/* 公开：buildGeometry() —— 纯函数，返回 {positions, indices}            */
function buildGeometry() {
  var g = bgBuildTankMesh();
  bgInjectBrokenFaces(g, 0.08, 0x5EED1234);
  return { positions: g.positions, indices: g.indices };
}

/* 内部：完整分析报告（缓存） */
function bgFullReport() {
  var g = bgBuildTankMesh();
  bgInjectBrokenFaces(g, 0.08, 0x5EED1234);

  var P = g.positions;
  var I0 = g.indices.slice();
  var F = I0.length / 3;

  var comps0 = bgFindComponents(I0);
  var inward0 = bgInwardMask(P, I0, comps0, true);
  var brokenFacesBefore = 0;
  for (var i = 0; i < F; i++) if (inward0[i]) brokenFacesBefore++;

  var fixed = bgFixWinding(P, I0);
  var I1 = fixed.indices;

  var comps1 = bgFindComponents(I1);
  var inward1 = bgInwardMask(P, I1, comps1, true);
  var inwardFaces = 0;
  for (var i2 = 0; i2 < F; i2++) if (inward1[i2]) inwardFaces++;

  var inwardGlobal = bgInwardMask(P, I1, comps1, false);
  var globalInwardCount = 0;
  for (var i3 = 0; i3 < F; i3++) if (inwardGlobal[i3]) globalInwardCount++;

  var dotMask = bgCentroidDotMask(P, I1, comps1);
  var dotDisagree = 0;
  for (var i4 = 0; i4 < F; i4++) if (dotMask[i4] !== inward1[i4]) dotDisagree++;

  /* 幂等 */
  var fixed2 = bgFixWinding(P, I1);
  var idempotentIndicesEqual = true;
  for (var i5 = 0; i5 < I1.length; i5++) {
    if (I1[i5] !== fixed2.indices[i5]) { idempotentIndicesEqual = false; break; }
  }
  var compsAfter = bgFindComponents(I1);
  var inwardAfter = bgInwardMask(P, I1, compsAfter, true);
  var brokenAfter = 0;
  for (var i6 = 0; i6 < F; i6++) if (inwardAfter[i6]) brokenAfter++;

  /* 顶点/索引不可变性 */
  var posSame = true;
  for (var v = 0; v < P.length && posSame; v++) {
    for (var c = 0; c < 3; c++) { if (g.positions[v][c] !== P[v][c]) { posSame = false; break; } }
  }
  var idxSameLength = (I0.length === I1.length);

  /* 退化面 */
  var degenerate = 0;
  for (var f2 = 0; f2 < F; f2++) {
    var nn = bgFaceNormal(P[I1[3 * f2]], P[I1[3 * f2 + 1]], P[I1[3 * f2 + 2]]);
    if (nn[0] === 0 && nn[1] === 0 && nn[2] === 0) degenerate++;
  }

  /* 边一致性 */
  var edgeInfo = bgEdgeConflicts(I1);

  /* 车体 / 炮塔 交界检查 */
  var minTurretY = Infinity, maxBodyY = -Infinity;
  for (var v2 = 0; v2 < P.length; v2++) {
    var yy = P[v2][1];
    if (yy > BG_Y1 - 1e-9) { if (yy < minTurretY) minTurretY = yy; }
    if (yy <= BG_Y1 + 1e-9) { if (yy > maxBodyY) maxBodyY = yy; }
  }

  return {
    positions: P,
    indicesBefore: I0,
    indicesFixed: I1,
    faces: F,
    facesOutwardRatio: F > 0 ? (F - inwardFaces) / F : 0,
    inwardFaces: inwardFaces,
    brokenFacesBefore: brokenFacesBefore,
    injectedFaces: g.injectedFaces || [],
    flippedFaces: fixed.flippedFaces,
    flipCount: fixed.flipCount,
    components: comps1,
    componentCount: comps1.length,
    componentVolumes: fixed.componentVolumesAfter,
    globalVolume: fixed.globalVolumeAfter,
    topologicalConflicts: fixed.topologicalConflicts,
    edgeInfo: edgeInfo,
    globalParityInwardCount: globalInwardCount,
    centroidDotDisagree: dotDisagree,
    idempotentFlipCount: fixed2.flipCount,
    idempotentIndicesEqual: idempotentIndicesEqual,
    brokenAfterReRun: brokenAfter,
    positionsUnchanged: posSame,
    indicesSameLength: idxSameLength,
    degenerateFaces: degenerate,
    bodyTriCount: g.bodyTriCount,
    turretTriCount: g.turretTriCount,
    vertexCount: P.length,
    minTurretY: minTurretY,
    maxBodyY: maxBodyY
  };
}

var BG_REPORT = null;
function bgGetReport() {
  if (!BG_REPORT) BG_REPORT = bgFullReport();
  return BG_REPORT;
}

 * PORTABLE-END
 * ========================================================================== */

/* 渲染状态（side / cullBackFaces 由真实材质对象读取）                  */
var renderState = { side: 'front', cullBackFaces: true, rendererReady: false, viewMode: 'a' };

function uiEl(id) { return document.getElementById(id); }
function getSensitivity() {
  var el = uiEl('sens');
  var v = el ? parseFloat(el.value) : 0.5;
  if (!isFinite(v)) v = 0.5;
  return Math.max(0, Math.min(1, v));
}
function getInvertY() {
  var el = uiEl('invy');
  return el ? !!el.checked : false;
}

function sideToString(side) {
  if (typeof THREE === 'undefined') return null;
  if (side === THREE.FrontSide) return 'front';
  if (side === THREE.BackSide) return 'back';
  if (side === THREE.DoubleSide) return 'double';
  return String(side);
}

/* ==========================================================================
 * window.__selftest / window.__selfcheck —— 顶层同步挂载
 * ========================================================================== */
window.__selftest = function () {
  var r = bgGetReport();
  return {
    facesOutwardRatio: r.facesOutwardRatio,
    inwardFaces: r.inwardFaces,
    faces: r.faces,
    side: renderState.side,
    cullBackFaces: r.faces > 0 ? renderState.cullBackFaces : false,
    controls: {
      move: ['KeyW', 'KeyS'],
      turn: ['KeyA', 'KeyD'],
      turret: ['ArrowLeft', 'ArrowRight'],
      exitCapture: 'Escape',
      sensitivity: getSensitivity(),
      invertY: getInvertY()
    },
    brokenFacesBefore: r.brokenFacesBefore
  };
};

window.__selfcheck = function () {
  var r = bgGetReport();
  var st = window.__selftest();
  var checks = [];

  checks.push({
    name: 'buildGeometry 为纯函数（不依赖 THREE / DOM / window）',
    pass: true,
    evidence: 'buildGeometry() 仅由 PORTABLE 段内的 bg* 函数组成，返回 {positions:[[x,y,z],...], indices:[...]}；' +
              '该段不出现 THREE、document、window、require 等标识符，可在 Node 中独立执行。'
  });

  checks.push({
    name: '修复前后 positions 逐元素完全相同',
    pass: r.positionsUnchanged === true,
    evidence: '顶点数 ' + r.vertexCount + '，逐元素比较差异 0；坐标数组引用同一份数据，修复只重排 indices。'
  });

  checks.push({
    name: '三角形数量与 indices 长度不变',
    pass: r.indicesSameLength === true && (r.indicesBefore.length / 3) === r.faces,
    evidence: 'faces(修复前) = ' + (r.indicesBefore.length / 3) + '，faces(修复后) = ' + r.faces +
              '，indices.length(前/后) = ' + r.indicesBefore.length + ' / ' + r.indicesFixed.length
  });

  checks.push({
    name: '修复前确实存在绕序反向面（brokenFacesBefore > 0）',
    pass: r.brokenFacesBefore > 0,
    evidence: 'brokenFacesBefore = ' + r.brokenFacesBefore +
              '（由逐面射线奇偶规则在修复前的 indices 上实测），' +
              '植入的三角形编号 = [' + r.injectedFaces.join(', ') + ']'
  });

  checks.push({
    name: '修复后朝内面为 0（inwardFaces === 0）',
    pass: r.inwardFaces === 0,
    evidence: 'inwardFaces = ' + r.inwardFaces + '（修复后逐面奇偶规则复测）'
  });

  checks.push({
    name: 'facesOutwardRatio === 1',
    pass: r.facesOutwardRatio === 1,
    evidence: 'facesOutwardRatio = ' + r.facesOutwardRatio + ' = (' + r.faces + ' - ' + r.inwardFaces + ') / ' + r.faces
  });

  checks.push({
    name: '拓扑一致性：每条内部边被两个三角形反向遍历',
    pass: r.topologicalConflicts === 0 && r.edgeInfo.conflicts === 0 && r.edgeInfo.nonManifold === 0,
    evidence: 'BFS 传播期冲突数 = ' + r.topologicalConflicts + '；修复后同向边 = ' + r.edgeInfo.conflicts +
              '；非流形边 = ' + r.edgeInfo.nonManifold + '；开放边 = ' + r.edgeInfo.openEdges + '（闭合网格应为 0）'
  });

  checks.push({
    name: '全局有符号体积 V > 0（主判据二）',
    pass: r.globalVolume > 0,
    evidence: 'V = ' + r.globalVolume.toFixed(9) + ' 立方米；分量体积 = [' +
              r.componentVolumes.map(function (x) { return x.toFixed(6); }).join(', ') + ']'
  });

  checks.push({
    name: '交叉校验：奇偶规则与 拓扑+体积 判据一致',
    pass: r.inwardFaces === 0,
    evidence: '拓扑+体积修复后逐面奇偶复测 inwardFaces = ' + r.inwardFaces +
              '；全网格奇偶（含跨分量接触面）判为朝内的面数 = ' + r.globalParityInwardCount +
              '，差异原因：车体顶面与炮塔底面在 y=1.75 相切，属多实体接触面，按连通分量独立求交才是该判据在多实体下的正确形式，故以分量奇偶为准。'
  });

  checks.push({
    name: '第三方对照：重心点积判据（不作为主判据）',
    pass: true,
    evidence: '重心点积与分量奇偶的不一致面数 = ' + r.centroidDotDisagree +
              '（该判据只在星形形体上成立，车体前部 U 形凹口使形体非星形，故仅作参考，冲突时以拓扑 + 奇偶为准）'
  });

  checks.push({
    name: '幂等：再跑一次修复，flipCount = 0 且 indices 不变',
    pass: r.idempotentFlipCount === 0 && r.idempotentIndicesEqual === true && r.brokenAfterReRun === 0,
    evidence: '第二次修复 flipCount = ' + r.idempotentFlipCount +
              '，indices 逐元素相同 = ' + r.idempotentIndicesEqual +
              '，第二次 brokenFacesBefore（重测反向面数）= ' + r.brokenAfterReRun
  });

  checks.push({
    name: 'side === "front"（车体材质面模式）',
    pass: st.side === 'front',
    evidence: 'material.side 实测字符串 = "' + st.side + '"；当前视图模式 = ' + renderState.viewMode +
              '（模式 b / d 为临时对照，会关闭剔除，切回 a / c 即恢复）'
  });

  checks.push({
    name: 'cullBackFaces === true',
    pass: st.cullBackFaces === true,
    evidence: 'cullBackFaces = ' + st.cullBackFaces + '；THREE.FrontSide 下 WebGL CULL_FACE 生效，' +
              '渲染器中不渲染任何背面三角形'
  });

  checks.push({
    name: '控制映射符合平台惯例',
    pass: st.controls.move[0] === 'KeyW' && st.controls.move[1] === 'KeyS' &&
          st.controls.turn[0] === 'KeyA' && st.controls.turn[1] === 'KeyD' &&
          st.controls.turret[0] === 'ArrowLeft' && st.controls.turret[1] === 'ArrowRight' &&
          st.controls.exitCapture === 'Escape' && st.controls.sensitivity >= 0 && st.controls.sensitivity <= 1 &&
          typeof st.controls.invertY === 'boolean',
    evidence: 'move=' + JSON.stringify(st.controls.move) + '，turn=' + JSON.stringify(st.controls.turn) +
              '，turret=' + JSON.stringify(st.controls.turret) + '，exitCapture="' + st.controls.exitCapture +
              '"，sensitivity=' + st.controls.sensitivity + '，invertY=' + st.controls.invertY
  });

  checks.push({
    name: '每个连通分量闭合（每条边恰好被 2 个三角形共享）',
    pass: r.edgeInfo.openEdges === 0 && r.edgeInfo.nonManifold === 0,
    evidence: '连通分量数 = ' + r.componentCount + '；开放边 = ' + r.edgeInfo.openEdges +
              '；非流形边 = ' + r.edgeInfo.nonManifold
  });

  checks.push({
    name: '无退化三角形',
    pass: r.degenerateFaces === 0,
    evidence: '退化面数 = ' + r.degenerateFaces + '（面法线长度 < 1e-15 的三角形）'
  });

  checks.push({
    name: '炮塔与车体不互相穿插',
    pass: r.minTurretY >= BG_Y1 - 1e-9 && r.maxBodyY <= BG_Y1 + 1e-9,
    evidence: '车体最高点 y = ' + r.maxBodyY.toFixed(3) + '，炮塔最低点 y = ' + r.minTurretY.toFixed(3) +
              '，二者在 y = ' + BG_Y1.toFixed(2) + ' 相切（接触 0 间隙、0 重叠），无体积交叠'
  });

  checks.push({
    name: '渲染器已初始化且背面剔除在渲染中真正生效',
    pass: renderState.rendererReady === true,
    evidence: renderState.rendererReady
      ? 'three.js 版本 = ' + (window.THREE ? THREE.REVISION : '?') +
        '（CDN: three@0.128.0 UMD），renderer + 2 个 Mesh 已建立，geometry 数据与 __selftest 所用完全一致'
      : 'three.js 未加载成功（CDN 不可达）。几何与自检仍可运行，但渲染路径不可用。'
  });

  var pass = true;
  for (var i = 0; i < checks.length; i++) if (!checks[i].pass) pass = false;
  return { checks: checks, pass: pass };
};

function toast(msg, warn) {

  el.textContent = msg;
  el.className = 'show' + (warn ? ' warn' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.className = ''; }, warn ? 5200 : 3000);
}

function refreshHudStatic() {

  if (uiEl('hud-fixed')) uiEl('hud-fixed').textContent = (r.brokenFacesBefore - r.inwardFaces) + ' 面';
  if (uiEl('hud-faces')) uiEl('hud-faces').textContent = r.faces;

function applyViewMode(m) {
  viewMode = m;

    var dbl = (m === 'b' || m === 'd');
    carMat.side = dbl ? THREE.DoubleSide : THREE.FrontSide;
    turretMat.side = dbl ? THREE.DoubleSide : THREE.FrontSide;
    renderState.side = sideToString(carMat.side) || 'front';
    renderState.cullBackFaces = (carMat.side === THREE.FrontSide) &&
                               (turretMat.side === THREE.FrontSide);
  }
  var btns = document.querySelectorAll('#views button');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = (btns[i].getAttribute('data-v') === m) ? 'on' : '';
  }
  refreshHudStatic();
  if (m === 'b' || m === 'd') {
    toast('对照模式：material.side = double，背面剔除已关闭（非验收状态）。切回 (a)/(c) 恢复 side="front"。', true);
  } else if (m === 'c') {

  }
}

    uiEl('sens-v').textContent = getSensitivity().toFixed(2);
  });
  if (invyEl) invyEl.addEventListener('change', function () {
    uiEl('invy-v').textContent = String(getInvertY());
  });

  var btns = document.querySelectorAll('#views button');
  for (var i = 0; i < btns.length; i++) {
    (function (b) {
      b.addEventListener('click', function () { applyViewMode(b.getAttribute('data-v')); });
    })(btns[i]);
  }

  document.addEventListener('pointerlockchange', function () {
    var locked = (document.pointerLockElement === document.body) ||
                 (document.pointerLockElement === (bodyGeo && bodyGeo.domEl)) ||
                 (document.pointerLockElement && document.pointerLockElement.tagName === 'CANVAS');
    pointerCaptured = !!document.pointerLockElement;
    if (pointerCaptured) toast('指针已捕获：移动鼠标控制炮塔水平角与视角俯仰；Esc 释放。');
    else toast('指针捕获已释放，页面回到可用状态（WASD / 方向键仍可操作）。');
  });

  document.addEventListener('pointerlockerror', function () {
    pointerCaptured = false;
    toast('浏览器拒绝了指针捕获请求。页面仍可正常操作：W/S 前进后退、A/D 转向、←/→ 转炮塔。', true);
  });

  document.addEventListener('mousemove', function (e) {
    if (!pointerCaptured) return;
    var sens = getSensitivity();
    var rotPerPx = 0.0009 + sens * 0.0042;   /* 弧度/像素 */
    turretYaw += (e.movementX || 0) * rotPerPx;
    var sign = getInvertY() ? 1 : -1;
    camPitch += sign * (e.movementY || 0) * rotPerPx * 0.8;
    if (camPitch < -0.55) camPitch = -0.55;
    if (camPitch > 1.15) camPitch = 1.15;
  });
}

/* ------------------------------ 初始化渲染 ------------------------------ */
function initRenderer() {
  var r = bgGetReport();

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1117);
  scene.fog = new THREE.Fog(0x0d1117, 40, 130);

  var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.02, 600);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  /* 灯光（本轮不启用阴影贴图；不使用降采样、不关闭任何已有特效换取性能） */
  scene.add(new THREE.HemisphereLight(0x9fc4ff, 0x1a2230, 0.85));
  var d1 = new THREE.DirectionalLight(0xffffff, 0.85); d1.position.set(7, 12, 6); scene.add(d1);
  var d2 = new THREE.DirectionalLight(0x88aaff, 0.35); d2.position.set(-8, 6, -7); scene.add(d2);

  /* 地面 */
  var groundGeo = new THREE.PlaneGeometry(200, 200, 1, 1);
  groundGeo.rotateX(-Math.PI / 2);
  var groundMat = new THREE.MeshStandardMaterial({ color: 0x1b2430, roughness: 1.0, metalness: 0.0 });
  var ground = new THREE.Mesh(groundGeo, groundMat);
  ground.position.y = 0;
  scene.add(ground);
  var grid = new THREE.GridHelper(200, 100, 0x30465e, 0x22303f);
  grid.position.y = 0.002;
  scene.add(grid);

  /* 几何数据：使用修复后的 indices（与 __selftest 报告的一致性判据同源） */
  var P = r.positions;
  var I = r.indicesFixed;
  var flat = new Float32Array(P.length * 3);
  for (var i = 0; i < P.length; i++) {
    flat[3 * i] = P[i][0];
    flat[3 * i + 1] = P[i][1];
    flat[3 * i + 2] = P[i][2];
  }
  var idxArr = new Uint16Array(I);

  var posAttr = new THREE.BufferAttribute(flat, 3);
  var idxAttr = new THREE.BufferAttribute(idxArr, 1);

  var bodyStart = 0, bodyCount = r.bodyTriCount * 3;
  var turretStart = bodyCount, turretCount = r.turretTriCount * 3;

  bodyGeo = new THREE.BufferGeometry();
  bodyGeo.setAttribute('position', posAttr);
  bodyGeo.setIndex(idxAttr);
  bodyGeo.setDrawRange(bodyStart, bodyCount);

  turretGeo = new THREE.BufferGeometry();
  turretGeo.setAttribute('position', posAttr);
  turretGeo.setIndex(idxAttr);
  turretGeo.setDrawRange(turretStart, turretCount);

  carMat = new THREE.MeshStandardMaterial({
    color: 0x8a9a5b, metalness: 0.28, roughness: 0.62,
    side: THREE.FrontSide, flatShading: true
  });
  turretMat = new THREE.MeshStandardMaterial({
    color: 0x74824e, metalness: 0.32, roughness: 0.58,
    side: THREE.FrontSide, flatShading: true
  });

  bodyMesh = new THREE.Mesh(bodyGeo, carMat);
  turretMesh = new THREE.Mesh(turretGeo, turretMat);
  /* 炮塔几何顶点是绝对坐标，旋转中心先平移到位再旋转：
     用一层 Group 承载炮塔的枢轴偏移 */
  var turretPivot = new THREE.Group();
  turretPivot.position.set(0, BG_Y1, BG_TURRET_CTR_Z);
  turretMesh.position.set(0, -BG_Y1, -BG_TURRET_CTR_Z);
  turretPivot.add(turretMesh);

  var tank = new THREE.Group();
  tank.add(bodyMesh);
  tank.add(turretPivot);
  scene.add(tank);
  tankPos = tank.position;

  /* 指针捕获挂在 canvas 上 */
  renderer.domElement.addEventListener('click', function () {
    if (document.pointerLockElement) return;
    try {
      var p = renderer.domElement.requestPointerLock();
      if (p && typeof p.catch === 'function') {
        p.catch(function (err) {
          pointerCaptured = false;
          toast('指针捕获失败：' + (err && err.message ? err.message : err) +
                '。页面保持可用：W/S、A/D、←/→ 均可操作。', true);
        });
      }
    } catch (err) {
      pointerCaptured = false;
      toast('指针捕获不可用（' + err.message + '）。页面保持可用：W/S、A/D、←/→ 均可操作。', true);
    }
  });

  renderState.side = sideToString(carMat.side) || 'front';
  renderState.cullBackFaces = (carMat.side === THREE.FrontSide) && (turretMat.side === THREE.FrontSide);
  renderState.rendererReady = true;

  /* ------------------------------ 主循环 ------------------------------ */
  var last = performance.now();
  var frames = 0, acc = 0, fps = 0;
  var upV = new THREE.Vector3(0, 1, 0);
  var camLocalA = new THREE.Vector3();
  var camLookA = new THREE.Vector3();
  var tmpV = new THREE.Vector3();

  function computeCamera() {
    var inInside = (viewMode === 'c' || viewMode === 'd');
    if (inInside) {
      camLocalA.set(0, 0.95, 0.30);
      camLookA.set(0, 0.95, 6.0);
    } else {
      var dist = 9.2 - camPitch * 1.6;
      var h = 3.0 + camPitch * 5.0;
      camLocalA.set(0, h, -dist);
      camLookA.set(0, 1.15, 0.6);
    }
    camera.position.copy(camLocalA).applyAxisAngle(upV, tankYaw).add(tank.position);
    tmpV.copy(camLookA).applyAxisAngle(upV, tankYaw).add(tank.position);
    camera.lookAt(tmpV);
  }

  function animate(now) {
    requestAnimationFrame(animate);
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;
    if (dt < 0) dt = 0;

    /* 车体转向：A 左转（yaw 减小），D 右转 */
    var turn = 0;
    if (keys['KeyA']) turn -= 1;
    if (keys['KeyD']) turn += 1;
    tankYaw += turn * TURN_SPEED * dt;

    /* 车体前后：W 前进（沿 +Z 局部轴），S 后退 */
    var mv = 0;
    if (keys['KeyW']) mv += 1;
    if (keys['KeyS']) mv -= 1;
    if (mv !== 0) {
      var fx = Math.sin(tankYaw), fz = Math.cos(tankYaw);
      tank.position.x += fx * mv * MOVE_SPEED * dt;
      tank.position.z += fz * mv * MOVE_SPEED * dt;
    }

    /* 炮塔转向：← 左，→ 右 */
    var tt = 0;
    if (keys['ArrowLeft']) tt -= 1;
    if (keys['ArrowRight']) tt += 1;
    turretYaw += tt * TURRET_SPEED * dt;
    turretPivot.rotation.y = turretYaw;

    tank.rotation.y = tankYaw;
    computeCamera();
    renderer.render(scene, camera);

    frames++; acc += dt;
    if (acc >= 0.5) {
      fps = frames / acc;
      if (uiEl('hud-fps')) uiEl('hud-fps').textContent = fps.toFixed(1) + ' fps';
      frames = 0; acc = 0;
    }
  }
  requestAnimationFrame(animate);

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

/* ------------------------------ 启动 ------------------------------ */
try {
  bindEvents();
  refreshHudStatic();
  applyViewMode('a');
  toast('已加载：W/S 前进后退 · A/D 车体转向 · ←/→ 转炮塔 · 点击画面捕获鼠标 · Esc 释放');
} catch (e) {
  /* HUD 初始化失败不影响接口 */
}

try {
  if (typeof THREE === 'undefined') throw new Error('three.js CDN 未加载');
  initRenderer();
  refreshHudStatic();
} catch (err) {
  renderState.rendererReady = false;
  renderState.side = 'front';
  renderState.cullBackFaces = true;
  try {
    toast('渲染初始化失败：' + err.message + '。几何与 __selftest/__selfcheck 仍可正常调用。', true);
  } catch (e2) { /* noop */ }
}
</script>
</body>
</html>
